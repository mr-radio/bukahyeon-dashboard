const STORE_KEY='bukahyeon-premium-weekly-v8';

function readPremiumHistory(){let raw={};try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){raw=volatileHistory}let out={};for(const z of ['3','2']){const base={date:SAMPLE_DATE,value:snap(z).avg,source:'네이버 매물 설명에서 P 명시된 표본'};let extra=Array.isArray(raw[z])?raw[z].filter(x=>/^20\d{2}-\d{2}-\d{2}$/.test(x.date)&&Number.isFinite(+x.value)&&+x.value>0).map(x=>({date:x.date,value:+x.value,source:'직접 입력'})):[];out[z]=[base,...extra.filter(x=>x.date!==SAMPLE_DATE)].sort((a,b)=>a.date.localeCompare(b.date));}return out;}
function latestPremium(z){return readPremiumHistory()[z].at(-1)}
function weeklyComparison(z){let history=readPremiumHistory()[z],now=history.at(-1);let d=new Date(now.date+'T12:00:00');d.setDate(d.getDate()-7);let prev=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let old=history.find(x=>x.date===prev);if(!old)return null;let diff=now.value-old.value;return {diff,percent:old.value?100*diff/old.value:null,prev,now};}
function changeHtml(z){let c=weeklyComparison(z);if(!c)return '<span class="delta unknown">지난주 대비 <b>— 자료 없음</b></span>';let dir=c.diff>0?'up':c.diff<0?'down':'flat';return `<span class="delta ${dir}">지난주 대비 <b>${c.diff>0?'▲ ':c.diff<0?'▼ ':''}${c.diff>0?'+':''}${money(c.diff)}${c.percent===null?'':` (${c.percent>0?'+':''}${c.percent.toFixed(1)}%)`}</b></span>`;}
function trendChart(z,compact=true){let series=readPremiumHistory()[z],w=510,h=compact?112:184,pad=compact?14:23,chartH=h-2*pad;let vals=series.map(x=>x.value);let lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5,span=hi-lo;const xx=i=>series.length===1?w/2:pad+i*(w-2*pad)/(series.length-1);const yy=v=>h-pad-((v-lo)/span)*chartH;const points=series.map((x,i)=>`${xx(i).toFixed(1)},${yy(x.value).toFixed(1)}`).join(' ');let grid=[0.25,.5,.75].map(t=>`<line x1="${pad}" y1="${(pad+chartH*t).toFixed(0)}" x2="${w-pad}" y2="${(pad+chartH*t).toFixed(0)}" stroke="#e5eee7" stroke-dasharray="4 5"/>`).join('');let dots=series.map((x,i)=>`<circle cx="${xx(i)}" cy="${yy(x.value)}" r="${compact?5:6}" fill="#fff" stroke="#187655" stroke-width="3"/>`).join('');return `<div class="trend-wrap"><svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${z}구역 프리미엄 기록 추이, ${series.length}개 시점">${grid}${series.length>1?`<polyline points="${points}" fill="none" stroke="#187655" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}${dots}</svg><div class="trend-meta"><span>${series[0].date.slice(5).replace('-','/')}</span><span>${series.length>1?series.at(-1).date.slice(5).replace('-','/'):'최초 기록 1건'}</span></div>${series.length===1?'<div class="trend-empty">지난주 값이 없어 추세선은 아직 표시하지 않습니다.</div>':''}</div>`;}
function savePremiumEntry(z){let date=document.getElementById('p-date-'+z).value,amount=Number(document.getElementById('p-avg-'+z).value);let note=document.getElementById('p-note-'+z);if(!date||date===SAMPLE_DATE||!Number.isFinite(amount)||amount<=0||amount>100){note.textContent='기준일과 다른 날짜 및 0보다 큰 평균 P값을 입력하세요.';return;}let history=readPremiumHistory(),raw={};try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){raw=volatileHistory}raw[z]=(Array.isArray(raw[z])?raw[z]:[]).filter(x=>x.date!==date);raw[z].push({date,value:amount});try{localStorage.setItem(STORE_KEY,JSON.stringify(raw));storageWarning=''}catch(e){volatileHistory=raw;storageWarning='현재 브라우저의 저장이 제한되어 입력값은 이 화면에서만 유지됩니다. 새로고침 시 사라질 수 있습니다.'}homeTiles();document.getElementById('detailContent').innerHTML=priceDetail();}

const CHAT_POSTS=[{"id":"chat-2026-11-20-detail-v6","date":"2026-11-20","title":"11월 20일 (금) · 사무실 미개설 답변과 현장 소통·교통 개선","summary":"1. 온라인 지지층 밖의 조합원과도 소통하자는 제안\n오전에는 임원 선거를 앞두고 온라인 활동에 익숙하지 않은 조합원에게 어떻게 다가갈지가 주요 화두였습니다. 다른 단체의 전화를 받았다는 경험이 공유되자, 협의회도 전화 안내와 현장 방문을 병행하고 아직 입장을 정하지 않은 조합원에게 사업 정상화 방향을 설명하자는 의견이 나왔습니다. 온라인에서 이미 지지를 정한 사람들끼리 이야기하는 것만으로는 충분하지 않다는 취지였습니다.\n자원봉사자 모집, 조합원의 전문성을 활용한 재능기부, 후원금으로 활동을 지원하는 방안도 제시됐습니다. 생업 때문에 직접 참여하기 어려운 사람은 가능한 범위에서 돕자는 의견과 후보들이 직접 현장을 다녀야 한다는 의견이 함께 나왔습니다.\n\n2. 협력업체 활용을 둘러싼 의견 차이\n현장 조직을 만들자는 제안은 업체 지원을 받아야 하는지에 대한 논쟁으로도 이어졌습니다. 선거에서 이기기 위해 다양한 수단을 검토해야 한다는 의견이 있었지만, 업체에 의존하면 이후 조합 운영에서 부담이 생기고 업체 없이 활동해 온 협의회의 신뢰가 약해질 수 있다는 반론도 있었습니다.\n사무실과 현장 활동을 강조했던 참여자는 업체와 결탁하라는 뜻이 아니라 자원봉사와 후원 등을 통해 조합원 접점을 늘리자는 취지였다고 설명했습니다. 별도 인력을 고용해 전화 안내를 하자는 제안에는 방장이 외부 인력의 전화 홍보로 받아들여질 수 있다는 우려를 전했습니다.\n\n3. 변경인가를 빨리 받기 위한 실무와 협력업체 관리\n오전 10시 39분부터 집행부 선임 이후 대의원회 구성, 사업시행계획 변경인가, 분양신청, 관리처분인가까지의 구체적인 순서를 묻는 대화가 이어졌습니다. 한 참여자는 조합이 정상화되면 변경인가를 우선 추진하고 보완할 사항은 조건부 인가 이후 처리하는 방식으로 시간을 줄일 수 있다고 봤습니다.\n관계부서 회람 서류가 빠질 때마다 일정이 늘어날 수 있으므로 집행부와 협력업체의 서류 준비 및 문제 해결 능력이 중요하다는 설명도 나왔습니다. 건축·환경·교통 심의가 한 번에 통과되지 않았던 경험을 들어 기존 업체의 역량을 질문하는 발언이 있었습니다.\n정비·설계·철거업체를 모두 교체할지에 대해서는 의견이 갈렸습니다. 계약을 일괄 무효화하면 다시 지연될 수 있다는 의견, 우선 함께 일할 수 있는지 살펴보되 문제가 드러나면 조합원에게 설명하고 교체하자는 의견, 설계업체는 역량 있는 곳으로 바꾸자는 의견이 제시됐습니다. 업체와는 공문으로 소통해 기록을 남기자는 이야기도 있었습니다.\n\n4. 주요 공지 및 운영진 답변 — 사무실 미개설 결정\n오후 12시 10분 협의회 부방장은 전날 제안을 바탕으로 운영진이 충분히 논의했고 외부 조언도 들었다며, 사무실을 열지 않는 편의 실익이 더 크다고 판단했다고 밝혔습니다. 조합원 방문은 적고 이권에 관심 있는 외부 관계자 등이 드나들 가능성을 우려한 결정이라는 설명이었습니다.\n이어 차담 등 다른 방식으로 동네 조합원을 만날 계획을 세우겠다고 답했습니다. 오후 3시 43~45분에는 사무실 운영의 득실과 협의회의 순수성을 보고 지지하는 조합원들의 신뢰를 함께 고려했다는 추가 답변이 나왔습니다. 조합장 후보가 선거에 전념할 수 있다는 설명도 덧붙였습니다.\n\n5. 사무실 개설 찬성 측의 반론과 대안\n사무실이 필요하다는 참여자들은 조합원이 저절로 찾아오기를 기다리는 공간이 아니라, 방문하고 싶도록 만들어야 하는 거점이라고 설명했습니다. 길에서 인사를 나누고 차 한 잔을 권하며 관계를 쌓는 활동과 온라인 홍보는 효과가 다르다는 주장이었습니다.\n과거 전문관리인 총회에 직접 참석했을 때 온라인에서 느끼던 분위기와 현장이 달랐다는 경험도 공유됐습니다. 운영진의 결정을 존중하면서도 사무실 유무와 별개로 후보들의 대면 활동은 강화해 달라는 의견이 이어졌습니다. 유튜브로 구역을 걸으며 공약을 설명하고 문자로 영상 링크를 안내하자는 제안도 나왔습니다.\n\n6. 주요 공지 및 운영진 답변 — 다른 형태의 소통 방안\n오후 1시 48분 협의회 운영진이 직접 방문해 유튜브와 사무실 운영에 대한 의견을 읽었으며, 제안과는 조금 다른 형태의 대안을 고민 중이라고 밝혔습니다. 조합원이 찾아오고 싶도록 만들어야 한다는 취지에 공감하고 더 가까이에서 발로 뛰겠다고 답했습니다.\n오후 3시 1분에는 익명 공간에서 자유롭게 나오는 솔직한 의견과 창의적인 아이디어를 높이 평가한다고 전했습니다. 방장에게 불필요한 오해가 생기는 점 등을 염려해 직접 참여는 마치되 앞으로도 의견에 귀 기울이겠다고 밝혔습니다. 방장은 북아현3구역에 관한 이야기라면 다양한 입장의 참여가 가능하다는 방 운영 원칙을 설명했습니다.\n\n7. 충정로에서 광화문 방향으로 나가는 길\n오후에는 북아현 순환로와 연결되는 충정로 쪽 진출입 문제가 논의됐습니다. 한 참여자는 도로가 확장되더라도 광화문 방향으로 바로 좌회전할 수 없다면 충정로역 쪽으로 이동해 우회해야 하는 불편이 남는다고 설명했습니다. 통일로의 기존 혼잡에 북아현2·3구역 입주 이후 교통량까지 더해질 수 있다는 우려였습니다.\n재정비촉진계획 변경과 통합심의 단계에서 좌회전 방안을 검토하자는 제안과, 심의가 지연될 수 있다면 입주 이후 주민 의견을 모아 추진하자는 의견이 함께 나왔습니다. 인접 구역과 기존 아파트가 함께 교통 개선을 요구하는 방안도 거론됐습니다.\n\n8. 주요 공지 및 운영진 답변 — 교통 개선보다 인허가 속도 우선\n오후 2시 38분 운영진은 충정로 진출 시 광화문 방향으로 직접 좌회전하는 안을 교통전문가에게 사전 검토받고 관계기관과 협의해 볼 수 있다고 답했습니다. 다만 그 과정이 인허가 등 사업 진도에 지장을 주어서는 안 된다고 강조했습니다.\n교통 개선과 신속성 중 하나를 택해야 한다면 현재 상황에서는 신속성을 우선하는 편이 좋겠다는 입장이었습니다. 제안 내용을 다른 운영진과 논의하겠다고 밝혔고, 제안자도 입주까지 속도를 내면서 차차 보완하는 방향에 공감했습니다.\n\n9. 철도 지하화와 선형공원에 대한 기대\n서울역과 경부선 지하화 이야기를 계기로 북아현을 지나는 경의선도 함께 지하화될 수 있는지 논의됐습니다. 참여자들은 철도 지하화 이후 보행·산책 환경과 서울역 북부역세권 접근성이 나아질 가능성을 기대했습니다. 서울역 지하화와 경의선 구간을 함께 봐야 한다는 참여자의 설명도 있었습니다.\n대화에서는 지상·지하 선로가 공사 중 함께 운영될 수 있는 공간 등 구체적인 조건도 거론됐습니다. 이는 참여자들이 제시한 연계 구상과 기대였습니다.\n\n10. 선거 절차의 공정성과 연내 공고 기대\n다른 정비구역 총회 경험을 전한 참여자는 후보 소개 자료의 형식과 본인확인·투표 관리 방식이 결과에 영향을 줄 수 있다고 설명했습니다. 선거 준비 과정에서 홍보 기회와 절차의 공정성을 살펴야 한다는 취지의 대화였습니다.\n저녁에는 연내 선관위 공고 가능성을 기대하는 의견과 더 지연돼서는 안 된다는 반응이 나왔습니다. 전날 급매로 나온 물건이 바로 거래됐다는 참여자의 제보도 공유됐습니다."},{"id":"chat-2026-11-21-detail-v6","date":"2026-11-21","title":"11월 21일 (토) · 업체 계약·선관위 구성과 조합원 소통","summary":"1. 대의원회 공백과 선거 지연에 대한 답답함\n임원 선출이 늦어지고 대의원회가 정상적으로 작동하지 않는 상황에 대한 불만이 이어졌습니다. 참여자들은 집행부를 다시 구성하는 일이 우선이라고 보면서, 기존 지지층만 결집할 것이 아니라 아직 입장을 정하지 않은 조합원에게 다가가야 한다고 말했습니다.\n다른 입장을 가진 조합원도 왜 그런 선택을 하는지 이해하고 대화해야 한다는 의견이 나왔습니다. 함께 커피를 마시는 일상적인 접점이나 현장 만남을 통해 친밀감을 쌓는 활동이 필요하다는 취지였습니다. 전날 사무실을 열지 않기로 한 결정 이후에도 대면 활동의 필요성에 관한 논의가 계속됐습니다.\n\n2. 업체 선정 기준과 계약 구조의 투명성\n오전 10시 51분부터 정비사업 협력업체가 선정되는 방식에 관한 긴 대화가 이어졌습니다. 한 참여자는 적격심사표를 특정 업체에 유리하게 구성하거나 여러 법인·관계업체를 통해 계약하는 방식이 있을 수 있다고 주장하며, 계약 상대방의 이름만 볼 것이 아니라 선정 기준과 업체 간 관계도 살펴야 한다고 설명했습니다.\n다른 정비구역까지 연계된 용역 계약과 업체 지원 문제에 대한 주장도 오갔습니다. 참여자들은 업체 선정과 계약 관리가 조합원의 부담으로 돌아올 수 있다는 점에 주목했습니다. 이후 대화는 기존 계약을 어떻게 다루고 새 집행부가 업체를 어떻게 통제할지로 이어졌습니다.\n\n3. 기존 계약을 모두 바꿀 것인지에 대한 의견 차이\n오전 11시 21분에는 기존 업체와의 계약을 모두 백지화하는 것 자체도 위험하다는 의견이 나왔습니다. 계약 과정에 불공정이나 위법이 명확하다면 소송을 검토할 수 있다는 의견, 해지가 어렵다면 재계약이나 조건 변경으로 조정하자는 의견이 함께 제시됐습니다.\n관리처분 단계까지는 기존 업무를 이어가고 이후 재정비촉진계획 변경 때 업체를 바꾸는 방안도 거론됐습니다. 반면 새 집행부가 기존 업체와 협의해 업무를 진행하는 선택지도 필요하다는 의견이 있었습니다. 현재는 선거에 집중하고 계약 문제는 집행부 선임 이후 다루자는 발언도 나왔습니다.\n\n4. 선관위 구성 방식과 총회 공고\n오후에는 공고가 언제 나오는지에 대한 질문과 구청의 유권해석 질의가 무엇에 관한 것인지 추정하는 대화가 이어졌습니다. 한 참여자는 해석을 받더라도 구청이 총회를 추진하는 과정에서 제기될 수 있는 시비를 줄인 뒤 공고해야 하지 않겠느냐고 봤습니다.\n선관위를 조합원만으로 구성하는지, 다른 방식이 검토되는지에 대한 추측도 있었습니다. 저녁 7시 15분에는 구청장이 직권으로 총회를 개최하고 조합원들이 구청 주관 선관위 구성 동의서를 모아 요청하는 방안을 결합하자는 제안이 나왔습니다. 공고나 구성이 확정됐다는 발표와는 구분되는 참여자들의 논의였습니다.\n\n5. 조합 실무 경험자 영입 제안\n오후 3시 14분부터 과거 조합에서 실무를 맡았던 인사를 협의회가 영입하는 방안이 제시됐습니다. 제안자는 기존 업무 이력과 협력업체를 잘 알고, 지역 조합원에게도 인지도가 있어 새 집행부의 업무 인수와 선거 활동에 도움이 될 수 있다고 봤습니다.\n실제로 조합에 문의했을 때 모르는 내용을 알아본 뒤 답을 줬고, 구청 공문에 신속히 대응했으며, 업무 일정표를 공유했던 경험이 소개됐습니다. 다른 참여자는 기존 집행부 출신이라는 이유로 반발이나 부정적인 홍보가 생길 수 있어 전면 영입이 쉽지 않을 수 있다고 봤습니다. 득실을 따져 가용한 방법을 폭넓게 활용하자는 찬성 의견도 나왔습니다.\n\n6. 선거 준비 과정에서 드러나는 소통 방식\n오후 3시 48분에는 표를 얻기 위해 조합원에게 설명하는 과정 자체가 이후 조합 운영의 미리보기가 된다는 의견이 나왔습니다. 필요한 지출이나 새로운 제안이 있을 때 처음 반응이 좋지 않더라도 충분히 설명해 설득해야 한다는 주장으로 이어졌습니다.\n선거 공고 전후 활동 범위를 의식해야 한다는 대화도 있었습니다. 공고 이후에는 선거운동 방식에 대한 다툼이 생길 수 있으므로 지금부터 조합원과의 접점을 넓혀야 한다는 참여자의 의견이었습니다.\n\n7. 공개 대화방에서의 표현과 포용성\n저녁에는 다른 대화방의 참여자 관리와 공개 발언을 두고, 선거를 준비하는 운영진이 불필요한 편 가르기로 보일 표현을 줄였으면 좋겠다는 의견이 나왔습니다. 앞뒤 사정을 모두 모르는 조합원은 눈앞의 발언만으로 판단할 수 있다는 지적이었습니다.\n상대편에 배타적인 집단이라는 인상을 주면 지지 확대에 도움이 되지 않을 수 있으므로, 알려진 운영진일수록 카톡 한 줄과 말 한마디를 신중하게 해야 한다는 의견이 이어졌습니다. 다른 참여자는 과거 대화방을 흔드는 사례를 겪어 예민하게 대응한 배경을 설명했습니다. 참여자들은 그 취지를 이해하면서도 실제 선거에 도움이 되는 방식인지 살펴 달라고 요청했습니다.\n\n8. 북아현의 미래 가치에 대한 서로 다른 시각\n오전에 공유된 블로그 글은 행정구역과 단지 분할 등을 이유로 북아현2·3구역의 미래 가격을 보수적으로 보는 내용이었습니다. 오후에는 이에 동의하지 않는 참여자들의 의견이 이어졌습니다. 재개발 단지가 도로로 나뉘는 것은 흔하며, 단순히 행정구역이나 평형만으로 가치를 비교하기 어렵다는 주장이었습니다.\n성수·목동 등의 최신 설계, 같은 평형에서도 달라지는 공간 활용, 소형 평형의 상품성이 언급됐습니다. 밤에는 아현뉴타운과 북아현뉴타운이 함께 완성되며 주거환경이 넓게 정비되는 효과, 단지 구성과 이름을 통한 인지도 형성, 고급화의 필요성을 기대하는 의견이 나왔습니다. 모두 참여자들이 제시한 비교와 전망이었습니다.\n\n9. 입주 후 고치기 어려운 생활 설비\n세대 내 음식물쓰레기 처리시설이나 공용 계단실에서 이용할 수 있는 시설 등 생활 편의를 설계 단계에서 반영하자는 대화가 있었습니다. 나중에 바꾸기 어려운 부분을 처음부터 제대로 설계해야 한다는 의견이었습니다.\n서울역 북부역세권과 선형공원이 연결되면 도보 생활권이 좋아질 것이라는 기대도 공유됐습니다. 한편 낮 12시 5분에는 아파트 매물의 ‘11.2억원 거래’를 언급하는 참여자 제보가 있었습니다."},{"id":"chat-2026-11-22-detail-v6","date":"2026-11-22","title":"11월 22일 (일) · 선거 일정 예상·포용적 소통과 매물 권리관계","summary":"1. 임원총회는 언제 열릴지에 대한 질문\n오전에는 사업이 늦어지면서 계속 보유할지, 다른 곳으로 갈아탈지 고민하는 참여자의 질문이 나왔습니다. 임원총회가 언제 열릴지 묻는 말에 한 참여자는 선관위 구성 이후에도 물리적인 준비 시간이 필요하다며 ‘12월 선관위, 1월 조합장 선거’ 정도를 예상했습니다.\n다른 정비구역의 관리처분인가와 착공 소식을 보며 북아현3구역의 지연을 아쉬워하는 반응도 있었습니다. 제시된 선거 시점은 참여자의 예상이었습니다.\n\n2. 연령·직업·거주지로 비꼬는 표현을 줄이자는 의견\n오전 11시 33분에는 현장 조합원을 설득해야 하는 상황에서 특정 연령대를 비꼬는 말을 줄이자는 요청이 나왔습니다. 나이뿐 아니라 직업군과 사는 곳을 한데 묶어 비난하기보다 구체적인 사람의 말과 행동에 관해 이야기하자는 취지였습니다.\n모든 조합원이 한 표를 갖는 만큼 다양한 사람을 최대한 안고 가야 하며, 이번 선임총회 이후 입주까지도 소통을 이어가야 한다는 의견이 뒤따랐습니다. 다른 참여자는 좋은 의견이라며 노력해 보겠다고 답했습니다.\n\n3. 후보들의 직접 설명과 현장 접점\n오후에는 조합장 예비후보와 각 진영 관계자들이 대화방에 직접 와서 조합원에게 설명해 달라는 제안이 나왔습니다. 방장도 이 방에서 소통 행사를 한다면 환영하며 사회를 맡을 수 있다고 밝혔습니다.\n온라인에서 깨끗하고 새로운 이미지를 보여 주는 데 그치지 말고 실제로 조합원을 만나야 한다는 의견도 있었습니다. 자원봉사, 전단지, 지역 모임 등 여러 방식으로 접점을 넓혀 달라는 요청과 친밀감을 쌓는 활동이 필요하다는 이야기가 이어졌습니다.\n\n4. 선거 절차와 단지 상품성을 둘러싼 우려\n오전 뉴스 스크랩에서는 가재울7구역 선거 관련 문제를 다룬 방장의 글이 공유됐습니다. 오후에는 총회의 본인확인과 서면결의·투표 관리에 대한 걱정이 나왔습니다.\n분담금을 낮추기 위해 소형 평형을 늘리고 커뮤니티를 줄이거나 스카이브릿지를 없애자는 과거 주장에 대한 반대 의견도 있었습니다. 참여자들은 그런 방향이 단지 상품성에 미칠 영향을 우려했습니다.\n공유된 글: https://blog.naver.com/ahyeonddu/224486204675\n\n5. 무허가·멸실 매물과 감정평가\n오후 5시대에는 무허가 건축물과 이미 철거된 매물, 1+1, 평형 신청 등에 관한 대화가 이어졌습니다. 한 참여자는 다시 매수한다면 작은 멸실 무허가 매물을 찾겠다는 개인적인 선호를 밝혔고, 다른 참여자는 감정평가 전후에 매물에 대한 평가가 달라질 수 있다고 봤습니다.\n취득세와 주택 수 처리, 토지사용료, 건물 관리 부담도 질문으로 나왔습니다. ‘취득세 0’, ‘주택 수 제외’라는 참여자 발언에 이어 다른 참여자가 토지분 취득세를 내는 문제 등을 설명하면서 의견을 보탰습니다. 매물의 상태와 권리관계별 차이를 두고 오간 대화였습니다.\n\n6. 대의원회 구성의 중요성\n저녁 7시 7분에는 협의회가 대의원회 구성을 중요하게 강조해 왔다는 발언이 나왔습니다. 질문자는 조합장 선거뿐 아니라 대의원회 구성에 힘을 쏟는 준비도 결국 임원 구성과 사업 정상화를 위한 방향이기를 바란다고 말했습니다.\n선거 결과만 기다리는 데 그치지 않고 이후 조합의 의사결정 구조를 어떻게 복구할지도 함께 관심을 갖는 대화였습니다.\n\n7. 중개업소 평가와 거래 경험\n밤에는 특정 중개업소를 높이 평가하는 말에 대해 실제 거래 과정에서는 다른 경험을 했다는 참여자들의 이야기가 나왔습니다. 한 참여자는 잘못 안내받은 부분으로 손해와 스트레스를 겪었다고 말했고, 스스로도 다시 확인했어야 했다는 아쉬움을 전했습니다.\n다른 참여자들은 중개업소를 지나치게 높이 평가하기보다 중립을 지키자는 의견을 냈습니다."},{"id":"chat-2026-11-23-detail-v6","date":"2026-11-23","title":"11월 23일 (월) · 변경인가 재신청·사업 일정과 1+1 매수 논의","summary":"1. 변경인가 재접수 때 기존 절차를 활용할 수 있는지\n오전 9시 27분부터 사업시행계획 변경인가 신청의 하자를 보완하면 바로 재접수할 수 있는지, 관계부서 협의와 주민공람도 다시 해야 하는지 질문이 나왔습니다. 기존 신청과 내용이 같다면 구청 협조로 일부 과정을 줄일 수 있다는 의견이 있었지만, 반려 이후 새로 신청하는 경우이므로 주민공람은 생략하기 어렵다는 반론이 이어졌습니다.\n낮에는 공람 의견마다 조합의 서면 대응과 조치방안이 필요하다는 설명이 나왔습니다. 행정기관과 협의해 처리 속도를 높이는 일과 정해진 절차 자체를 건너뛰는 일은 다르게 봐야 한다는 참여자들의 논의였습니다.\n\n2. 선거 전에 1+1 매물을 살지 기다릴지\n오후 1시 27분 한 매수 대기자가 마음에 드는 매물이 있지만 가족은 선관위 구성과 조합장 선출 이후 분위기를 보고 결정하길 원한다며 조언을 구했습니다. 질문자는 이후 1+1 매물을 찾고 있다고 밝혔습니다.\n정상적인 집행부가 선출되면 지금과 가격이 달라질 수 있다는 의견과, 큰 결정을 앞둔 만큼 결과를 지켜보는 편이 낫다는 의견이 갈렸습니다. 선거 결과에 따라 상승뿐 아니라 하락할 수도 있다는 지적도 있었습니다. 가족은 여러 단체로 갈라진 상황에서 조합장이 뽑혀도 사업이 순조로울지 걱정하고, 질문자는 오랜 지연을 겪은 만큼 선출 이후에는 한목소리가 나올 수 있다고 기대했습니다.\n\n3. 1+1의 희소성과 분양 조건\n한 참여자는 본인이 매수할 때 1+1 물건에 일반 매물보다 프리미엄을 5천만원 더 지급했다고 경험을 전했습니다. 조건에 맞는 1+1 매물은 자주 나오지 않으므로 원하는 물건을 놓친 뒤 비슷한 매물을 다시 찾기 어려울 수 있다는 의견도 나왔습니다.\n다른 한편으로는 1+1의 구체적인 조건이 명확한지 묻는 대화가 이어졌습니다. 추가 주택을 배정하지 않거나 일반분양가로 공급하는 경우 북아현2구역과 같은 갈등이 생길 수 있다는 우려였습니다. 조합장 선출과 별개로 앞으로 분양 조건을 둘러싼 이견이 남을 수 있다는 참여자들의 이야기였습니다.\n\n4. 참여자가 제시한 관리처분인가 일정\n오후 2시 9분에는 다음과 같은 예상 일정이 제시됐고, 오후 4시 16분에 다시 공유됐습니다.\n2026년 12월: 선임총회 공고\n2027년 1월: 조합장·임원 선출\n2월: 대의원회 선출\n3월: 사업시행계획 변경인가 총회·접수\n4월: 사업시행계획 변경인가\n6월: 분양신청 마감\n9월: 한국부동산원 검증 완료\n10월: 관리처분총회\n12월: 관리처분인가\n일정을 제시한 참여자는 계산을 세밀하게 한 안은 아니라고 밝혔고, 몇 달 더 걸려 2028년 상반기가 되더라도 다행이라는 반응도 있었습니다. 확정된 사업 일정이 아닌 참여자들이 가정한 시나리오였습니다.\n\n5. 대의원회 선출과 변경인가 총회를 함께 처리하는 방안\n오후에는 조합장과 이사회가 구성된 뒤 대의원회를 먼저 복구하지 않고 조합원 추인 방식으로 변경인가 총회와 접수를 할 수 있는지 논의됐습니다. 가능하다면 일정에서 약 1~1.5개월을 줄일 수 있다는 의견이었습니다.\n오후 5시 24분부터는 대의원 보궐선출과 변경인가 안건을 한 총회에서 각각 처리하는 방안도 거론됐습니다. 참여자들은 이사회 구성과 선관위 운영을 연결해 설명했으며, 다른 참여자는 법적으로 가능한지와 향후 소송 가능성을 질문했습니다.\n\n6. 전 집행부 소통 행사에서 공유된 반려 사유 설명\n오후 4시 소통 행사 관련 발언이 방에 전달됐습니다. 공유된 설명에서는 총회에서 사업시행기간을 ‘인가일로부터 청산 시까지’로 의결했으나, 세움터에는 숫자로 입력해야 해 ‘72개월’로 기재했고 주민공람과 부서 협의를 진행했다는 주장이 나왔습니다.\n이에 참여자들은 총회 의결 내용과 신청서·공람 공고의 문구가 달랐다는 점을 지적했습니다. 단순히 입력 시스템이나 구청의 태도 문제로 볼 수 있는지에 대해 반론이 이어졌습니다. ‘청산 시까지’, ‘청산 시까지(72개월)’, ‘72개월’이라는 표현 차이가 주요 논점이었습니다.\n\n7. 기존 사전분양과 검증을 활용하자는 행사 발언\n오후 4시 50분 공유된 행사 발언에서는 기존 사전분양 신청과 한국부동산원 사전 검증을 활용하면 관리처분 준비 시간을 줄일 수 있다는 주장이 소개됐습니다. 새 집행부 구성 후 변경인가를 받고 분양신청, 종후자산 평가, 조합원분양가·비례율 산정, 분담금 통보와 관리처분계획 수립을 진행한다는 설명이었습니다.\n해당 발언에는 2027년 10~11월경 관리처분인가를 기대하고, 접수 이후 이주 관련 업무도 미리 준비하면 이주개시 공고까지 가능할 것이라는 전망이 담겼습니다. 이는 행사에서 제시된 전망이었습니다. 대화방에서는 기존 업체 변경과 인가 일정의 관계를 두고도 의견이 오갔습니다.\n\n8. 세대수 확대와 쾌적성·사업성의 균형\n오후에는 층고를 높이는 설계와 세대수를 늘리는 방향 사이에서 균형을 잡아야 한다는 논의가 나왔습니다. 건물 높이, 용적률, 건폐율, 주동 간 거리, 일조와 통경축 등을 함께 고려해야 하며, 구릉지의 높이 차와 필로티를 활용하자는 제안이 있었습니다.\n저녁에는 4,700여 세대에서 5,300여 세대로 늘리는 안과 6,000세대까지 확대하는 구상이 비교됐습니다. 추가 인센티브에 따른 임대주택 부담이 생기는지, 세대수가 늘면 주차장·커뮤니티·교통영향평가에 어떤 영향을 주는지를 두고 의견이 이어졌습니다. 임대 비율과 공급 조건에 대해 참여자들이 추정한 수치를 놓고 계산을 주고받기도 했습니다.\n\n9. 설계공모는 그림뿐 아니라 공사비·시공 가능성까지\n오후 2시 23분에는 경쟁 설계공모로 좋은 제안을 받아야 하며, 조감도만 화려한 안이 아니라 실제 시공 가능한지와 공사비·물량 산출까지 함께 검토해야 한다는 의견이 나왔습니다. 업체를 바꾸는 일이 부담스럽다는 반응과 기존 업체가 새 요구를 제대로 반영할 수 있을지 묻는 의견도 있었습니다.\n최신 평면과 공간 활용, 기존 35평·45평형 거실 크기에 대한 아쉬움, 대단지에 맞는 설계 역량이 논점으로 이어졌습니다. 세대수와 주동 구성이 바뀔 때 다시 받게 될 심의를 고려해 설계 준비를 서두르자는 취지였습니다.\n\n10. 이주·철거와 후속 인허가를 겹쳐 준비하자는 제안\n저녁에는 관리처분인가 이후 이주·철거 기간에 재정비촉진계획 변경, 통합심의, 후속 인가와 분양 절차를 함께 준비해야 한다는 의견이 나왔습니다. 땅을 비운 뒤 절차가 지연되면 금융비용 부담이 커질 수 있다는 우려였습니다.\n한 참여자는 이주 1.5년과 철거 6개월을 가정해 그 안에 후속 절차를 진행해야 한다고 봤습니다. 다른 구역의 병행 사례도 언급됐지만 북아현3구역은 새 설계안을 준비하는 시간과 구청·서울시 협조를 함께 고려해야 한다는 의견이 이어졌습니다.\n\n11. 기부채납 체육시설을 도서관으로 바꾸자는 제안\n오후 8시에는 철도 굴다리 인근 기부채납 부지에 체육시설 대신 도서관을 유치하자는 제안이 나왔습니다. 맞은편에 북아현 문화체육센터가 있어 시설을 달리 구성하면 좋겠다는 취지였습니다.\n서울시 소관 시설로 거론된 오케스트라 연습장과 시민대학 등에 대한 기대도 있었습니다. 도서관 전환은 향후 구청과 협의해 보자는 참여자의 구상이었습니다.\n\n12. 선관위 전언과 매물·주변 분양시장\n오후 5시 32분 방장은 구청과 의회가 구역 상황을 알고 있고 선관위 구성 문제를 안전하게 정리한 뒤 공고하려 해 시간이 걸릴 수 있다는 제보를 전했습니다. 방장이 전달받은 이야기로 소개된 내용이었습니다.\n매물 관련해서는 북아현2구역의 P 13억원 안팎 매물과 오후에 언급된 P 12.5억원 매물이 화제가 됐습니다. 북아현3구역 아파트 매물이 며칠 전 P 11.2억원에 거래됐다는 참여자 제보도 나왔습니다.\n오전 뉴스 스크랩에는 경희궁 에피트 전용 84㎡ 최고 분양가 약 25억7,484만원을 소개하는 기사가 공유됐습니다.\n공유된 기사: http://www.consumernews.co.kr/news/articleView.html?idxno=768692"},{"id":"chat-2026-11-24-detail-v6","date":"2026-11-24","title":"11월 24일 (화) · 총회 절차 단축·1+1 조건과 설계 경쟁력","summary":"1. 집행부 공백 보도와 총회 공고를 기다리는 반응\n오전 방장은 북아현3구역의 집행부 공백 장기화와 사업 정상화 난항을 다룬 기사를 뉴스 스크랩으로 공유했습니다. 참여자들은 새 집행부 선출과 총회 공고를 기다리는 답답함을 드러냈습니다.\n오후 7시 35분에는 국토부 답변이 내려오는 데 시간이 필요하므로 총회 공고가 곧바로 나오기는 어려울 것이라는 참여자의 설명이 있었습니다.\n공유된 기사: https://www.sisajournal-e.com/news/articleView.html?idxno=425258\n\n2. 대의원회 복구 전에 변경인가 총회가 가능한지\n오전 9시 56분 전날 소통 행사에서 참고할 부분으로 두 가지가 제시됐습니다. 5,300~6,000세대 구상에서 사업성과 고급화의 균형을 잡는 일, 조합장·이사회 구성 후 대의원회를 복구하기 전에 변경인가 총회를 할 수 있는지였습니다.\n조합원 추인 형식으로 가능하다면 약 1~2개월을 줄일 수 있다는 기대가 나왔습니다. 동시에 총회 효력에 대한 가처분, 행정청 인가 이후 별도의 행정소송 가능성을 설명하는 발언도 있었습니다. 구청이 절차적 안정성을 위해 대의원회를 먼저 구성하라고 요구할 수도 있다는 의견이었으며, 새 집행부의 행정기관 협의 능력이 중요하다는 주장으로 이어졌습니다.\n\n3. 차기 집행부가 제시해야 할 1+1·분양 조건\n같은 오전 대화에서는 사업 일정뿐 아니라 조합원에게 돌아올 구체적인 조건도 설명해야 한다는 의견이 나왔습니다. 1+1을 유지하는지, 추가 주택을 조합원분양가로 공급하는지, 공사비와 조합원·일반분양가 및 비례율을 어떻게 예상하는지가 질문으로 제시됐습니다.\n오후에는 대지 지분이 큰 조합원들이 사업에 기여하는 점을 고려해야 한다는 의견과 북아현2구역의 1+1 갈등을 참고해야 한다는 이야기가 이어졌습니다. 구역 내 종교시설과 실리적으로 협의하는 능력도 필요하다는 발언이 있었습니다.\n\n4. 대체주택 비과세에 관한 질문과 사례 공유\n오전 10시 52분에는 사업시행인가 이후 북아현3구역을 매수한 경우 대체주택 비과세를 적용받을 수 있는지 질문이 나왔습니다. 일부 참여자는 재개발 주택을 취득한 시점과 대체주택 취득 시점을 구분해 설명했고, 관리처분인가 이전 주택을 산 경우와 이후 입주권을 산 경우도 구분해야 한다고 봤습니다.\n현재 집을 처분하고 대체주택을 취득할 계획이라는 개인 사례도 공유됐습니다. 대체주택을 분양권이나 입주권으로 취득하는 경우까지 가능한지 묻는 대화로 이어졌고, 질문자는 국세법령정보센터의 해석 자료를 모아 국세청 질의와 세무 상담을 해 보겠다고 말했습니다. 다른 참여자도 개별 재산과 관련된 문제인 만큼 세무사에게 검토받는 방안을 제안했습니다.\n같은 오전 종합부동산세 고지 이야기가 나왔고, 대출 규제와 거주할 주택을 마련하는 방법에 대한 고민도 함께 오갔습니다.\n\n5. 입주 후 운영 경험을 설계에 반영하자는 의견\n오후 1시 15분에는 아파트 입주자대표회장 경험을 바탕으로 정비사업 조합장에게 전하는 블로그 글이 공유됐습니다. 참여자들은 실제 입주 후 생기는 불편을 개발·설계 단계에서 반영할 수 있다는 점에 관심을 보였습니다.\n글을 읽은 참여자는 운영 과정의 문제를 미리 반영하는 일, 조합장이 모든 분야의 전문가가 될 필요는 없지만 전문가에게만 의존해서도 안 된다는 점, 서로 다른 조합원 의견을 듣되 특정 방향으로 결단할 수 있어야 한다는 점을 인상적인 내용으로 꼽았습니다.\n공유된 글: https://m.blog.naver.com/philipcommunications/224485520124\n\n6. 서대문구의회 영상과 과거 실태점검 논의\n오후 1시 43분 서대문구의회 제2차 정례회가 열리고 있다는 소식과 재정건설위원회 영상이 공유됐습니다. 참여자들은 가재울7구역의 과거 실태점검 지적사항과 후속 조치, 북아현3구역에 대한 행정 대응을 비교하며 대화를 나눴습니다.\n담당 공무원의 답변과 구청의 대응 기조에 관한 의견도 나왔습니다. 오후 2시 6분 방장은 관련 내용을 정리해 글로 쓰겠다고 밝혔고, 밤 9시 16분에는 자신의 블로그 링크를 공유했습니다.\n공유된 영상: https://www.youtube.com/watch?v=VYEBvs5mNEw\n밤에 공유된 글: https://blog.naver.com/ahyeonddu/224490455972\n\n7. 유튜브·SNS를 활용한 단지 홍보\n오후 3시 1분부터는 힐스테이트 메디알레의 입주 전 유튜브 홍보가 사례로 언급됐습니다. 입주자대표가 부동산 임장 채널에 아파트를 소개하는 모습을 보고 조합장에게도 대외활동과 마케팅 역량이 필요하다는 의견이 나왔습니다.\n새 집행부가 부동산 전문 채널에 출연해 구역을 소개하고 스스로 가치를 알렸으면 좋겠다는 제안이 이어졌습니다. 준공 이후 주요 매수층을 고소득 30~50대로 예상한 참여자는 그들이 선호할 상품성을 설계에 반영해야 한다고 봤습니다.\n\n8. AI를 활용한 문서·설계·공사비 검토 제안\n오후 3시 13분부터는 AI와 디지털 기술을 조합 업무에 활용하는 방안이 논의됐습니다. 문서 업무의 속도를 높이고 설계·재료를 사전에 검토하며, 시공사와 조합 사이의 정보 차이를 줄이는 데 활용하자는 의견이었습니다.\n특히 공사비 증액이 제기될 때 산출 근거를 분석하고 협상 자료를 만드는 데 도움이 될 수 있다는 제안이 나왔습니다. 조합이 새로운 도구를 이해하고 능동적으로 활용하는 조직이 됐으면 좋겠다는 취지였습니다.\n\n9. 하이엔드 브랜드와 단지 자체의 이름\n오후 3시 44분 광명 철산동의 디에이치 브랜드 적용 가능성을 다룬 기사가 공유되며 하이엔드 브랜드의 희소성과 가격 부담이 화제가 됐습니다. 브랜드가 넓게 쓰이면 그 위의 새 브랜드가 다시 생길 수 있다는 의견도 있었습니다.\n첼리투스·트리마제·파크리오처럼 시공사 이름을 전면에 내세우지 않고 단지 자체가 알려지는 방향이 제안됐습니다. 여러 브랜드를 함께 붙이기보다 하나의 이름으로 인지도를 만드는 편이 좋겠다는 의견도 나왔습니다.\n\n10. 건축설계사와 설계비·문주에 대한 논의\n저녁에는 ANU·건원·희림 등 설계사와 압구정·성수·한남·분당·목동의 최신 제안 사례가 언급됐습니다. 기존 설계안에 아쉬움을 느낀 참여자들은 대단지 규모에 맞는 설계 역량을 확보해야 한다고 말했습니다.\n기존 설계비에 대해서는 한 참여자가 최초 30억원대에 추가 증액 50억원대가 더해져 대략 80~90억원이었던 것 같다고 기억에 근거한 추정을 전했습니다. 다른 참여자는 타 구역을 참고해 5천~6천세대라면 설계비 130억원 정도를 생각해야 하지 않겠느냐는 의견을 냈습니다.\n기존 홍보 영상에서 문주가 보이지 않아 조합에 문의했다는 경험도 공유됐습니다. 문주는 별도 특화로 다룰 수도 있다는 의견과 문주 및 화강암 마감이 필요하다는 선호가 이어졌습니다.\n\n11. 북아현뉴타운 완성과 도심 생활권에 대한 기대\n오후 4시대에는 북아현과 마포 아현뉴타운의 가치 비교가 이어졌습니다. 북아현의 지가와 뉴타운 초기 프리미엄이 높았다는 회고, 2·3구역이 완성되면 인근 대표 아파트와 비교해 평가가 달라질 수 있다는 기대가 나왔습니다. CBD의 서대문역 방향 확장, 서소문로와 서울역 북부역세권 개발도 참여자들이 기대하는 요소로 언급됐습니다.\n저녁에는 프랑스대사관, 정동길, 덕수궁 등 주변 생활권에 관한 이야기가 이어졌습니다. 아직 주거지가 정돈되지 않았다는 외부 평가에 대해 북아현2구역 주상복합·스카이브릿지와 3구역 대단지가 완성된 뒤 지역의 모습이 달라질 것이라는 의견이 나왔습니다.\n\n12. 밤에 다시 공유된 사업 일정 시나리오\n오후 10시 12분에는 전날 제시한 예상 일정이 다시 공유됐습니다. 2026년 12월 선임총회 공고, 2027년 1월 임원 선출, 2월 대의원회 선출, 3월 변경인가 총회·접수, 4월 변경인가, 6월 분양신청 마감, 9월 한국부동산원 검증 완료, 10월 관리처분총회, 12월 관리처분인가를 가정한 안이었습니다.\n대의원회 선출을 별도로 먼저 진행하지 않아도 된다면 약 1~1.5개월을 줄일 수 있는지 질문이 이어졌습니다. 다른 참여자는 불가능한 시나리오라고 보지는 않지만 집행부가 집중적으로 일하고 사업을 방해하는 분쟁이 없어야 한다는 전제에서 제시한 것이라고 설명했습니다."}]; // Only verified, supplied summaries ({id,date,title,summary}).
const SEEN_KEY='bukahyeon_dashboard_seen_v1';
const getContentIds=()=>({
  news:DATA.news.map(x=>x.url),
  seoul:DATA.seoul.map(x=>x.url),
  blogs:DATA.bloggers.flatMap(b=>(b.scope==='category'?b.posts.filter(p=>p.categoryNo===38):b.posts).map(p=>p.url)),
  chat:CHAT_POSTS.map(x=>x.id)
});
const contentIds=getContentIds();
let seenIds={};
try {
  const stored=localStorage.getItem(SEEN_KEY);
  if(stored) {
    const parsed=JSON.parse(stored);
    for(const key of Object.keys(contentIds)) seenIds[key]=Array.isArray(parsed?.[key])?parsed[key]:contentIds[key].slice();
  } else {
    for(const key of Object.keys(contentIds)) seenIds[key]=contentIds[key].slice();
    localStorage.setItem(SEEN_KEY,JSON.stringify(seenIds));
  }
} catch(err) {
  for(const key of Object.keys(contentIds)) seenIds[key]=contentIds[key].slice();
}
let newIds={};
function refreshNewIds(){
  for(const key of Object.keys(contentIds)) newIds[key]=new Set(contentIds[key].filter(id=>!seenIds[key].includes(id)));
}
function markSectionViewed(key){
  if(!contentIds[key])return;
  seenIds[key]=contentIds[key].slice();
  try{localStorage.setItem(SEEN_KEY,JSON.stringify(seenIds))}catch(err){}
}
function newMark(){return '<span class="new-flag" aria-label="새로 등록된 글">NEW</span>'}
function badgeIfNew(key,id){return newIds[key]?.has(id)?newMark():''}
function badgeCount(key){return newIds[key]?.size?newMark():''}
refreshNewIds();

function compactTrend(z){
 const h=readPremiumHistory()[z].slice(-8);
 if(h.length<2)return '<div class="compact-trend-empty"><span class="compact-trend-point"></span><span>첫 기록 · 추이 자료 없음</span></div>';
 const v=h.map(x=>x.value),low=Math.min(...v)-.2,span=Math.max(...v)-low+.4;
 const pts=v.map((y,i)=>(8+i*184/Math.max(1,v.length-1)).toFixed(1)+','+(36-(y-low)/span*28).toFixed(1)).join(' ');
 return '<svg class="compact-spark" viewBox="0 0 200 44" preserveAspectRatio="none" aria-label="수집된 평균 프리미엄 추이"><polyline points="'+pts+'" fill="none" stroke="#17734f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="compact-trend-dates">'+esc(h[0].date.slice(5))+' ~ '+esc(h.at(-1).date.slice(5))+'</div>';
}

 document.getElementById('newsNew').innerHTML=badgeCount('news')||badgeCount('seoul');

   :'등록된 요약 없음';

 document.getElementById('headlineChange').innerHTML=changeHtml('3');
 document.getElementById('newsTile').innerHTML=DATA.news.slice(0,3).map(x=>`<div class="minirow"><div class="desc"><small>${esc(x.date)} · ${esc(x.source)}</small>${badgeIfNew('news',x.url)}${esc(x.title)}</div></div>`).join('');
 document.getElementById('blogTile').innerHTML=DATA.bloggers.slice(0,3).map(x=>`<div class="minirow"><div class="desc">${x.posts.some(p=>newIds.blogs.has(p.url))?newMark():''}${esc(x.name)}</div><span class="pill">${x.posts.length}건</span></div>`).join('');
 const a=latestPremium('3'),b=latestPremium('2');
 document.getElementById('priceTile').innerHTML=`<div class="pricegrid"><div class="pricebox primary"><small>3구역 평균 P</small><strong>${money(a.value)}</strong><span class="price-compare">${changeHtml('3')}</span></div><div class="pricebox"><small>2구역 평균 P</small><strong>${money(b.value)}</strong><span class="price-compare">${changeHtml('2')}</span></div></div><div class="compact-trend"><span class="compact-trend-label">3구역 프리미엄 추이</span>${compactTrend('3')}</div>`;
}

function show(type,fromHistory=false){if(document.getElementById('detail').classList.contains('on')&&location.hash==='#'+type&&!fromHistory)return;document.getElementById('dashboard').classList.add('off');document.getElementById('detail').classList.add('on');if(type==='seoul')newsMode='서울 정비사업';else if(type==='news'&&!fromHistory)newsMode='전체';let title={'news':'북아현·서대문 재개발 최근소식','blogs':'북아현3구역 주요 블로거','seoul':'북아현·서대문 재개발 최근소식','prices':'북아현 시세 · 주변 실거래','chat':'아현뚜방 톡방 요약'}[type];document.getElementById('detailTitle').textContent=title;let c=document.getElementById('detailContent');if(type==='news')c.innerHTML=newsDetail();if(type==='blogs')c.innerHTML=blogDetail();if(type==='seoul')c.innerHTML=newsDetail();if(type==='prices')c.innerHTML=priceDetail();if(type==='chat')c.innerHTML=chatDetail();if(type==='news')markSectionViewed('news');if(type==='seoul')markSectionViewed('seoul');if(type==='blogs')markSectionViewed('blogs');if(type==='chat')markSectionViewed('chat');if(!fromHistory&&location.hash!=='#'+type){location.hash=type}window.scrollTo(0,0)}
function renderDashboardHome(){document.getElementById('dashboard').classList.remove('off');document.getElementById('detail').classList.remove('on');refreshNewIds();homeTiles();window.scrollTo(0,0)}
function goHome(){
  // On-screen back button always returns home, without risking a browser/app exit.
  renderDashboardHome();
  try{history.replaceState({bukahyeonPage:'home'},'',location.pathname+location.search)}catch(e){}
}
function syncDashboardRoute(){
  const type=location.hash.slice(1);
  if(['news','blogs','seoul','prices','chat'].includes(type))show(type,true);
  else renderDashboardHome();
}
// Native hash navigation creates a real browser history entry on Android.
// Handle both hashchange and popstate, including a phone's system Back button.
window.addEventListener('hashchange',syncDashboardRoute);
window.addEventListener('popstate',syncDashboardRoute);
let newsMode='전체';
function newsDetail(){return `<div class="news-filter" role="group" aria-label="소식 유형">${['전체','뉴스','블로그','카페','서울 정비사업'].map(t=>`<button type="button" class="news-chip ${t===newsMode?'selected':''}" onclick="setNewsMode('${t}')">${t}</button>`).join('')}</div><div class="seoul-search"><input id="nq" type="search" placeholder="북아현3구역 · 조합 · 이주 등 검색" aria-label="최근소식 검색" oninput="refreshNewsRows()"></div><div class="news-cards" id="newsItems">${newsRows()}</div>`}
function setNewsMode(mode){newsMode=mode;markSectionViewed(mode==='서울 정비사업'?'seoul':'news');document.querySelectorAll('.news-chip').forEach(b=>{b.classList.toggle('selected',b.textContent===mode);b.setAttribute('aria-pressed',String(b.textContent===mode))});refreshNewsRows()}
function refreshNewsRows(){const el=document.getElementById('newsItems');if(el)el.innerHTML=newsRows();}
function newsRows(){let q=(document.getElementById('nq')?.value||'').trim().toLowerCase();let source=newsMode==='서울 정비사업'?DATA.seoul.map(x=>({...x,kind:'뉴스',area:'서울 정비사업'})):DATA.news;let items=source.filter(x=>(newsMode==='서울 정비사업'||newsMode==='전체'||x.kind===newsMode)&&(!q||(x.title+' '+x.source+' '+x.summary+' '+(x.area||'')).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));if(!items.length)return `<div class="news-empty">등록된 ${esc(newsMode)} 소식이 없습니다.<small>검증된 새 글이 수집되면 여기에 표시됩니다.</small></div>`;return items.map(x=>`<a class="news-card" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}" aria-label="게시글 원문 열기: ${esc(x.title)}"><div class="news-meta"><span class="news-tag">${x.kind==='뉴스'?'NEWS':x.kind==='블로그'?'BLOG':esc(x.kind)}</span>${badgeIfNew(newsMode==='서울 정비사업'?'seoul':'news',x.url)}<time>${esc(x.date.replaceAll('-','.'))}</time><span>·</span><span>${esc(x.source)}</span><span class="origin-note">· ${esc(x.area||'북아현')} · 원문 바로가기 ↗</span></div><div class="news-headline">${esc(x.title)}</div><p>${esc(x.summary||'관련 보도를 원문에서 확인할 수 있습니다.')}</p></a>`).join('')}

function blogDetail(){return `<div class="filter"><input id="blogq" placeholder="블로거 이름·글 제목 검색" oninput="filterBlogs()" aria-label="블로그 검색"></div><div class="author-grid" id="authors">${authorCards(DATA.bloggers)}</div>`}
function authorCards(items){return items.map(b=>{
  const posts=b.scope==='category'?b.posts.filter(p=>p.categoryNo===38):b.posts;
  const preview=posts.slice(0,5).map(p=>`<a class="post" target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">↗ ${badgeIfNew('blogs',p.url)}${esc(p.title)} ${p.date?`<small>(${esc(p.date)})</small>`:''}</a>`).join('');
  return `<div class="author"><h3>${esc(b.name)} ${posts.slice(0,5).some(p=>newIds.blogs.has(p.url))?newMark():''}</h3>${preview}<div class="bottom">${link(b.url,b.scope==='category'?'재개발 글 전체 보기 ↗':'블로그 모든 글 보기 ↗')}</div></div>`;
}).join('')}
function filterBlogs(){let q=document.getElementById('blogq').value.toLowerCase().trim();document.getElementById('authors').innerHTML=authorCards(DATA.bloggers.filter(b=>(b.name+' '+b.id+' '+b.posts.map(p=>p.title).join(' ')).toLowerCase().includes(q)))}
function seoulDetail(){return `<div class="seoul-search"><input id="sq" type="search" placeholder="기사 제목·언론사 검색" aria-label="서울 정비사업 기사 검색" oninput="filterSeoul()"></div><div class="news-cards" id="seoulList"></div>`}
function filterSeoul(){let box=document.getElementById('seoulList');if(!box)return;let q=(document.getElementById('sq').value||'').toLowerCase();let items=DATA.seoul.filter(x=>(x.title+' '+x.source+' '+x.summary).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));box.innerHTML=items.map(x=>`<article class="news-card"><div class="news-meta"><span class="news-tag">NEWS</span><time>${esc(x.date.replaceAll('-','.'))}</time><span>· ${esc(x.source)}</span></div><a class="news-headline" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><p>${esc(x.summary)}</p></article>`).join('')||'<div class="news-empty">검색 조건에 맞는 기사가 없습니다.</div>'}

// 아현뚜방 브리핑: 사용자가 연 날짜만 펼치고, 그 날짜의 제목이 화면 상단에 오도록 이동합니다.
const chatDetailContainer=document.getElementById('detailContent');
let userOpenedBrief=null;
chatDetailContainer.addEventListener('click',function(event){
  const summary=event.target.closest?.('summary');
  const brief=summary?.parentElement;
  if(brief?.matches('details.chat-brief')&&!brief.open)userOpenedBrief=brief;
});
chatDetailContainer.addEventListener('toggle',function(event){
  const opened=event.target;
  if(!opened.matches?.('details.chat-brief')||!opened.open)return;
  this.querySelectorAll('details.chat-brief[open]').forEach(other=>{
    if(other!==opened)other.open=false;
  });
  if(opened===userOpenedBrief){
    userOpenedBrief=null;
    requestAnimationFrame(()=>{
      if(!opened.isConnected||!opened.open)return;
      const top=opened.getBoundingClientRect().top+window.scrollY-12;
      window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    });
  }
},true);

function chatDetail(){
  if(!CHAT_POSTS.length)return '<section class="panel"><p class="chat-empty">등록된 톡방 요약이 없습니다.</p></section>';
  return CHAT_POSTS.slice().reverse().map((x,i)=>`<details class="panel chat-brief" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:700;line-height:1.6">${badgeIfNew('chat',x.id)}${esc(x.title)}</summary><small>${esc(x.date||'')}</small>${x.summary.split(/\n\n+/).map(block=>{let lines=block.split('\n'),head=lines.shift(),body=lines.join('\n');return '<section style="margin:16px 0;line-height:1.75;'+(/운영진 직접 답변|주요 공지 및 운영진 답변/.test(head)?'border-left:3px solid #527c68;padding:10px;background:rgba(100,140,110,.08);':'')+'"><h4 style="margin:0 0 7px;font-size:1em">'+esc(head)+'</h4><p style="margin:0;white-space:pre-line">'+esc(body)+'</p></section>';}).join('')}</details>`).join('');
}
function priceDetail(){let rows=['3','2'].map(z=>{let s=snap(z),p=DATA.price[z],latest=latestPremium(z);return `<section class="panel"><h3>북아현${z}구역 · 매물 프리미엄(P)</h3><div class="stats3"><div class="metric"><small>최저 P (최초 자료)</small><strong>${money(s.min)}</strong></div><div class="metric accent"><small>평균 프리미엄</small><strong>${money(latest.value)}</strong></div><div class="metric"><small>최대 P (최초 자료)</small><strong>${money(s.max)}</strong></div></div><div class="compare">${changeHtml(z)} · 최근 기록일 ${latest.date}</div><div class="detail-trend"><h4>주간 평균 P 추이</h4>${trendChart(z,false)}</div><p>${link(p.url,'네이버 부동산 매물 원문 ↗')}</p></section>`}).join('');let near=`<section class="panel"><h3>주변 아파트 최근 확인 실거래 · 전용 84㎡대</h3>${DATA.near.map(x=>`<div class="resultrow"><small>${esc(x.name)}</small><strong class="nearprice">${money(x.price)}</strong><div class="blurb">${esc(x.size)} · 계약 ${esc(x.date)} · ${esc(x.floor)} · ${x.name.includes('라첼스')?'입주권 여부 별도 확인':'매매 실거래'}</div>${link(x.url,'실거래 출처 ↗')}</div>`).join('')}<div class="footer">경희궁자이는 2단지, 마포래미안푸르지오는 2단지 기준입니다. 라첼스는 분양권/입주권 거래 가능성이 있어 기존 주택 매매와 동일 조건으로 비교하면 안 됩니다. 공식 국토교통부 자료와 계약해제 여부 재확인이 필요합니다.</div></section>`;return rows+near}

homeTiles();syncDashboardRoute();
</script></body></html>
