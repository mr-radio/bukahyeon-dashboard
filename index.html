function readPremiumHistory(){let raw={};try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){raw=volatileHistory}let out={};for(const z of ['3','2']){const base={date:SAMPLE_DATE,value:snap(z).avg,source:'네이버 매물 설명에서 P 명시된 표본'};let extra=Array.isArray(raw[z])?raw[z].filter(x=>/^20\d{2}-\d{2}-\d{2}$/.test(x.date)&&Number.isFinite(+x.value)&&+x.value>0).map(x=>({date:x.date,value:+x.value,source:'직접 입력'})):[];out[z]=[base,...extra.filter(x=>x.date!==SAMPLE_DATE)].sort((a,b)=>a.date.localeCompare(b.date));}return out;}
function latestPremium(z){return readPremiumHistory()[z].at(-1)}
function weeklyComparison(z){let history=readPremiumHistory()[z],now=history.at(-1);let d=new Date(now.date+'T12:00:00');d.setDate(d.getDate()-7);let prev=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let old=history.find(x=>x.date===prev);if(!old)return null;let diff=now.value-old.value;return {diff,percent:old.value?100*diff/old.value:null,prev,now};}
function changeHtml(z){let c=weeklyComparison(z);if(!c)return '<span class="delta unknown">지난주 대비 <b>— 자료 없음</b></span>';let dir=c.diff>0?'up':c.diff<0?'down':'flat';return `<span class="delta ${dir}">지난주 대비 <b>${c.diff>0?'▲ ':c.diff<0?'▼ ':''}${c.diff>0?'+':''}${money(c.diff)}${c.percent===null?'':` (${c.percent>0?'+':''}${c.percent.toFixed(1)}%)`}</b></span>`;}
function trendChart(z,compact=true){let series=readPremiumHistory()[z],w=510,h=compact?112:184,pad=compact?14:23,chartH=h-2*pad;let vals=series.map(x=>x.value);let lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5,span=hi-lo;const xx=i=>series.length===1?w/2:pad+i*(w-2*pad)/(series.length-1);const yy=v=>h-pad-((v-lo)/span)*chartH;const points=series.map((x,i)=>`${xx(i).toFixed(1)},${yy(x.value).toFixed(1)}`).join(' ');let grid=[0.25,.5,.75].map(t=>`<line x1="${pad}" y1="${(pad+chartH*t).toFixed(0)}" x2="${w-pad}" y2="${(pad+chartH*t).toFixed(0)}" stroke="#e5eee7" stroke-dasharray="4 5"/>`).join('');let dots=series.map((x,i)=>`<circle cx="${xx(i)}" cy="${yy(x.value)}" r="${compact?5:6}" fill="#fff" stroke="#187655" stroke-width="3"/>`).join('');return `<div class="trend-wrap"><svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${z}구역 프리미엄 기록 추이, ${series.length}개 시점">${grid}${series.length>1?`<polyline points="${points}" fill="none" stroke="#187655" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}${dots}</svg><div class="trend-meta"><span>${series[0].date.slice(5).replace('-','/')}</span><span>${series.length>1?series.at(-1).date.slice(5).replace('-','/'):'최초 기록 1건'}</span></div>${series.length===1?'<div class="trend-empty">지난주 값이 없어 추세선은 아직 표시하지 않습니다.</div>':''}</div>`;}
function savePremiumEntry(z){let date=document.getElementById('p-date-'+z).value,amount=Number(document.getElementById('p-avg-'+z).value);let note=document.getElementById('p-note-'+z);if(!date||date===SAMPLE_DATE||!Number.isFinite(amount)||amount<=0||amount>100){note.textContent='기준일과 다른 날짜 및 0보다 큰 평균 P값을 입력하세요.';return;}let history=readPremiumHistory(),raw={};try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){raw=volatileHistory}raw[z]=(Array.isArray(raw[z])?raw[z]:[]).filter(x=>x.date!==date);raw[z].push({date,value:amount});try{localStorage.setItem(STORE_KEY,JSON.stringify(raw));storageWarning=''}catch(e){volatileHistory=raw;storageWarning='현재 브라우저의 저장이 제한되어 입력값은 이 화면에서만 유지됩니다. 새로고침 시 사라질 수 있습니다.'}homeTiles();document.getElementById('detailContent').innerHTML=priceDetail();}
const money=x=>x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'억';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label='원문 보기 ↗')=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
const snap=z=>{let a=DATA.price[z].values;return {count:a.length,min:Math.min(...a),max:Math.max(...a),avg:a.reduce((x,y)=>x+y,0)/a.length}};

const CHAT_POSTS=[{"date":"2026-11-20","title":"11월 20일 (금) · 협의회 운영 방향과 교통 개선","summary":"오늘의 핵심 이슈\n선거관리위원회 구성 지연 우려, 평조합원협의회 소통 방식, 충정로 진출 교통 개선.\n\n1. 선거 일정과 소통\n참여자들은 연내 선관위 구성 가능성을 두고 의견을 나눴다. 온라인 홍보뿐 아니라 대면 소통, 전화 안내, 자원봉사와 재능기부를 활용하자는 제안이 나왔다. 디지털 도구를 활용해 조합 업무와 정보 공개를 개선하자는 의견도 있었다.\n\n2. 운영진 직접 답변 (13:48)\n협의회 운영진은 유튜브와 사무실 운영에 관한 제안을 읽었으며, 기존 제안과 다른 형태의 대안을 검토 중이라고 설명했다. 조합원이 자발적으로 찾아오도록 소통을 강화하겠다는 방향을 밝혔다.\n\n3. 교통 개선 (14:38)\n충정로 진출 시 광화문 방향 직접 좌회전 가능성을 교통전문가와 관계기관을 통해 검토하자는 의견이 나왔다. 운영진은 인허가 지연을 초래한다면 사업 속도를 우선하겠다고 답했다. 참여자들은 관리처분 이후 계획 변경 단계에서 검토하는 방안도 제시했다.\n\n4. 사무실 운영 (15:43~15:45)\n운영진 입장으로 소개된 답변에서는 사무실 개설에 따른 외부 이해관계자 접근 및 기존 지지층 신뢰 저하 가능성을 이유로 개설에 신중한 결론을 설명했다. 후보가 선거에 집중할 수 있다는 설명도 있었다.\n\n5. 시세 및 거래\n급매 거래가 있었다는 참여자 언급이 있었으나 계약서나 거래 조건은 확인되지 않았다.\n\n6. 사업시행계획 변경인가와 협력업체 역량 (오전 10시대)\n조합 정상화 이후 변경인가를 신속히 추진할 수 있는지를 두고 논의가 이어졌다. 한 참여자는 조건부 인가 후 보완하는 방식이 일정 단축에 도움이 될 수 있다고 보았다. 다른 참여자는 관계부서 회람 서류가 누락되면 보완에 시간이 걸리므로 조합과 협력업체의 실무 역량이 모두 중요하다고 강조했다. 과거 건축·환경·교통 심의에서 재심의가 있었다는 경험담을 바탕으로 설계업체 등 기존 계약의 적정성을 재검토하자는 의견도 나왔다. 다만 계약 해지와 소송은 별도의 법률·비용 검토가 필요하며, 조건부 인가 가능성도 확정된 사항은 아니다.\n\n7. 사무실 개설 논쟁의 구체적인 흐름 (12:10~12:43)\n협의회 부방장은 전날 제안을 운영진과 논의하고 외부 조언도 받은 결과 사무실을 개설하지 않는 편의 실익이 더 크다고 판단했다고 밝혔다. 이에 반대하는 참여자는 사무실에 조합원이 저절로 찾아오기를 기다리는 것이 아니라 방문할 이유를 만들어야 한다며, 고정된 대면 소통 장소와 일반 카페에서의 만남은 효과가 다르다고 설명했다. 기존 온라인 홍보가 이미 지지하는 조합원에게 집중될 수 있다는 지적도 있었다. 과거 총회 현장에 참석했던 참여자는 온라인 분위기와 현장 분위기가 달랐다고 회고했다. 오후 운영진 답변 이후에는 사무실 개설 여부와 별개로 후보들이 현장에서 직접 조합원을 만나는 활동은 필요하다는 절충 의견이 제시됐다.\n\n8. 선거 준비와 공정성\n다른 정비구역의 총회 경험을 소개하면서 선거운동 규칙과 후보 소개 책자의 공정성, 현장 본인확인 절차를 미리 검토해야 한다는 취지의 논의가 있었다. 타 구역의 구체적인 위법 의혹은 검증되지 않아 제외했다. 협의회는 오후 답변에서 후보가 선거 준비에 집중할 수 있다고 설명했지만, 실제 선거운동 계획과 선관위 규칙은 공개되지 않았다.\n\n9. 운영진의 익명 소통 공간에 대한 입장 (15:01)\n운영진은 익명 공간에서 자유롭게 제시되는 의견과 창의적인 아이디어를 높이 평가하며 지속적으로 의견을 듣겠다고 밝혔다. 직접 참여는 일단 종료하겠다는 뜻도 전했다. 이는 협의회의 소통 방향에 관한 발언이며 조합의 공식 결정은 아니다.\n\n10. 교통 개선의 범위\n충정로 좌회전 외에도 통일로의 기존 혼잡과 주변 신규 주택 공급을 고려한 광역 교통 검토 필요성이 제기됐다. 참여자는 향후 재정비촉진계획 변경 및 통합심의에서 교통영향평가를 활용하는 방안을 제시했으나, 심의 보류 가능성을 우려했다. 운영진과 참여자 모두 사업 일정에 지장을 주지 않는 범위에서 개선안을 검토하는 방향에 공감했다.\n\n11. 인허가 실무와 설계 개선의 우선순위\n오전 10시 44분부터 이어진 논의에서는 조합 정상화가 변경인가 추진의 출발점이라는 인식이 나타났다. 조건부 인가를 먼저 받고 후속 보완을 하는 방식이 제안됐지만, 그 전제는 행정기관이 해당 방식을 허용하고 필요한 서류가 갖춰지는 것이다. 오전 10시 45분에는 관계부서 회람 과정에서 서류 누락이 반복되면 일정이 지연될 수 있다는 지적이 나왔다. 오전 10시 48분에는 과거 여러 심의가 한 번에 통과되지 않았던 경험을 들어 기존 협력업체의 역량을 질문했다. 오전 10시 54분에는 설계업체 교체를 희망하는 의견이 제시됐다. 이 논의는 기존 계약을 즉시 해지하자는 공식 결정이 아니라 향후 집행부가 검토할 과제를 제시한 것이다.\n\n12. 대면 소통에 관한 찬반의 핵심 차이\n사무실 개설 찬성 측은 온라인에서 확인되는 지지 여론이 전체 조합원의 의사를 대표하지 않을 수 있다는 점을 강조했다. 오전에는 후원금과 자원봉사로 온·오프라인 조직을 만들자는 의견이 제시됐고, 정오 이후에는 과거 총회 현장의 분위기가 온라인과 달랐다는 경험이 공유됐다. 반대 측은 상설 사무실을 운영할 경우 조합원 접촉의 실익보다 외부 이해관계자의 접근과 신뢰 저하 위험이 크다고 판단했다. 양쪽 모두 조합원과의 소통 필요성 자체에는 공감했다. 차이는 상설 공간을 확보하는 것이 가장 효율적인 방법인지에 있었다. 오후 3시 48분에는 상설 사무실을 만들지 않더라도 후보가 직접 현장에 나가 조합원을 만나는 방식이 필요하다는 의견이 나왔다. 실제 대면 활동의 구체적인 일정과 운영 방식은 확인되지 않았다.\n\n주요 공지 및 운영진 답변 정리\n12:10 | 협의회 부방장: 운영진 논의와 조언을 거쳐 사무실 미개설 쪽으로 판단했다고 설명.\n13:48 | 협의회 운영진: 유튜브·사무실 관련 의견을 검토했으며 다른 형태의 대안을 고민 중이라고 설명.\n14:38 | 협의회 운영진: 교통전문가 사전 검토와 관계기관 협의를 제안하되 인허가 속도를 우선하겠다는 입장.\n15:01 | 협의회 운영진: 익명 공간의 의견을 지속적으로 듣겠다는 뜻을 밝힘.\n15:43~15:45 | 운영진 입장으로 소개된 답변: 사무실 미개설 이유와 후보의 선거 집중 가능성을 설명.\n위 내용은 협의회 발언이며 조합의 공식 의결이나 행정기관의 결정이 아니다.\n\n주요 사항 정리\n선관위 구성 | 공식 일정 확인 필요\n사무실 운영 | 협의회 미개설 입장, 대체 소통 방식 검토\n충정로 교통 | 직접 좌회전 제안, 전문가·관계기관 검토 필요\n인허가 | 신속성 우선 의견, 조건부 인가 가능 여부 미확인\n시세 | 급매 거래 언급만 확인, 가격 집계 제외\n\n정리 및 출처: 11월 20일 카카오톡 대화. 선관위 일정, 교통 변경 및 거래는 공식 확인 필요.","id":"chat-2026-11-20-detail-v3"},{"date":"2026-11-21","title":"11월 21일 (토) · 선거 준비와 업체 선정 투명성","summary":"오늘의 핵심 이슈\n선거 지연, 조합원 소통 전략, 업체 선정과 계약 투명성.\n\n1. 선거 준비\n대의원회 공백과 임원 선출 지연에 대한 우려가 이어졌다. 기존 지지층 외 조합원에게도 설명하고 사업 정상화와 절차 준수를 중심으로 소통하자는 의견이 나왔다. 상대방 비판보다 실행 가능한 대안을 제시해야 한다는 의견도 있었다.\n\n2. 업체 선정\n참여자들은 적격심사 기준과 계약 상대방의 실질적 관계를 검토해야 한다고 주장했다. 신규 집행부가 계약 자료와 선정 절차를 투명하게 공개해야 한다는 취지의 논의였다. 특정 업체나 개인에 관한 확인되지 않은 의혹은 제외했다.\n\n3. 선관위 구성\n오후에는 구청의 공고 여부와 유권해석, 선관위 구성 방식에 관한 전망이 오갔다. 조합원 중심 구성 가능성이 언급됐으나 공식 결정은 확인되지 않았다.\n\n4. 시세 및 거래\n11.2억원 거래 제보가 있었지만 가격의 성격과 실제 계약 여부를 검증하지 못했다.\n\n5. 선거 전략과 대면 접촉\n전날 사무실 미개설 결정 이후에도 현장 활동의 필요성은 계속 논의됐다. 기존 지지층을 결집하는 것과 아직 입장을 정하지 않은 조합원을 설득하는 것은 다른 과제라는 의견이 나왔다. 참여자들은 선거 공고 이후에는 선거운동 규칙이 적용될 수 있으므로 공고 전후 활동 범위를 구분할 필요가 있다고 보았다. 실제 허용 범위는 선관위 규정 확인이 필요하다.\n\n6. 기존 실무 경험의 활용 (15:18 이후)\n과거 조합 업무를 수행한 실무 경험자를 새 집행부에 영입하는 방안이 개인 제안으로 등장했다. 기존 업체와 업무 이력을 이해하고 지역 조합원과 소통할 수 있다는 장점이 제시됐다. 반면 기존 지지층의 반응과 신뢰 문제도 고려해야 한다는 논의가 이어졌다. 영입 결정이나 당사자 동의는 확인되지 않았다.\n\n7. 설계와 미래 가치 (17:52)\n도로로 단지가 나뉘는 재개발의 특성과 향후 설계 개선 가능성을 비교했다. 최신 세대의 아파트 설계가 적용되면 실사용 공간과 상품성이 달라질 수 있다는 전망이 나왔다. 성수·목동 사례가 비교 대상으로 언급됐지만 북아현3구역에 동일한 설계가 적용된다는 의미는 아니다.\n\n8. 선거 절차와 향후 계약 관리\n참여자들은 선거 승리 자체와 선출 이후의 계약 관리 과제를 구분했다. 계약 검토는 집행부 선임 이후 진행하되 현재는 임원 선출에 집중하자는 의견이 있었다. 업체 선정 과정의 경쟁성과 계약 이력 공개가 향후 중요한 검토 대상이라는 취지였다.\n\n9. 기존 계약을 전면 교체할 것인가\n오전 10시 53분 이후 업체 선정의 경쟁성과 계약 구조를 두고 의견이 오갔다. 동일하거나 관계가 있는 업체가 반복적으로 선정되는 경우 조합원이 계약의 적정성을 의심할 수 있다는 문제 제기였다. 오전 11시 21분에는 기존 계약을 모두 백지화하는 것도 위험하다는 반론이 나왔다. 오전 11시 57분부터는 해지 가능 여부, 계약 과정의 위법·불공정 여부, 재계약 또는 계약조건 변경 가능성이 차례로 논의됐다. 계약 해지의 법적 근거와 비용은 계약서 및 관련 자료를 확인해야 판단할 수 있다. 현재 단계에서는 선거를 우선하고 계약 문제는 새 집행부 선임 후 검토하자는 의견도 있었다.\n\n10. 구청 주관 선거와 선관위 구성\n오후 1시 12분에는 앞서 예상했던 공고 시점이 지나도록 공고가 나오지 않았는지 묻는 발언이 있었다. 오후 1시 21분에는 유권해석 이후에도 총회 개최 과정에서 발생할 수 있는 절차상 분쟁을 최소화한 뒤 공고할 필요가 있다는 의견이 나왔다. 저녁 7시 15분에는 구청장 직권 총회와 구청 주관 선관위 구성 요청을 결합하는 방식이 개인 제안으로 등장했다. 어느 방식이 실제 채택됐는지 확인할 수 없다.\n\n11. 평형과 상품성에 대한 관점\n오후 4시대부터 설계 개선과 고급화 논의가 이어졌고, 오후 5시 53분에는 같은 평형이라도 공간 활용과 상품성에 따라 가치가 달라질 수 있다는 의견이 제시됐다. 다른 신축 단지의 소형 평형 설계를 비교 사례로 들었다. 향후 설계 변경이 실제로 가능한 범위와 사업비에 미치는 영향은 별도 검토가 필요하다.\n\n주요 사항 정리\n임원 선출 | 공고 시점 미확인\n기존 계약 | 전면 해지와 조건 변경 등 검토 의견 병존\n실무 인력 | 기존 경험자 활용 제안, 결정 없음\n설계 | 공간 효율과 상품성 개선 의견\n거래 | 11.2억원 언급, 계약 및 가격 성격 미확인\n\n정리 및 출처: 11월 21일 카카오톡 대화. 선거 공고와 거래 자료는 별도 확인 필요.","id":"chat-2026-11-21-detail-v3"},{"date":"2026-11-22","title":"11월 22일 (일) · 임원총회 일정과 매수 유의사항","summary":"오늘의 핵심 이슈\n임원총회 일정, 단지 설계 방향, 매물 권리관계 확인.\n\n1. 임원총회\n참여자들은 선관위 구성 이후에도 총회 준비에 물리적인 시간이 필요하다는 점을 언급하며 일정 지연을 우려했다. 북아현2구역 진행 사례도 비교 대상으로 거론됐다.\n\n2. 사업성과 설계\n분담금 절감과 소형 평형 확대, 커뮤니티 시설 규모 조정에 관한 과거 논의가 다시 언급됐다. 이는 참여자 의견이며 새로 확정된 설계 변경 사항은 아니다.\n\n3. 매물과 거래\n다양한 권리관계의 매물이 존재한다는 의견과 중개 과정에서 설명과 실제 조건이 달랐다는 개인 경험이 공유됐다. 매수 전 권리관계와 계약 조건을 서류로 확인할 필요성이 드러났다. 특정 중개업소에 관한 개인 주장 및 식별 정보는 제외했다.\n\n4. 조합원 통합과 선임 이후의 과제 (11:36)\n참여자는 모든 조합원이 한 표를 갖는다는 점을 강조하면서 특정 지지층에만 의존하지 않고 가능한 많은 조합원을 포용해야 한다고 제안했다. 이러한 소통은 선임총회에서 끝나는 것이 아니라 입주까지 이어져야 한다는 의견이었다. 여의도 대교 사례도 비교 대상으로 언급됐으나 구체적 적용 방안은 제시되지 않았다.\n\n5. 총회 공정성에 대한 우려\n오후에는 선임총회에서 본인확인과 투표 절차가 공정하게 운영돼야 한다는 우려가 이어졌다. 이는 참여자의 문제 제기이며 실제 위조나 위법 행위가 발생했다는 확인은 아니다. 선거관리위원회의 구성과 공식 규칙이 공개되면 확인할 사항으로 남는다.\n\n6. 매물 정보의 해석\n매물별 조건이 다양하므로 단순 금액 비교만으로는 매수 판단이 어렵다는 의견이 나왔다. 저녁에는 중개 설명에 대한 개인 경험이 공유됐다. 구체적인 손해나 책임 소재는 원문만으로 판단할 수 없으므로 공개 브리핑에는 포함하지 않았다.\n\n7. 감정평가와 권리관계에 관한 추가 논의\n오후 5시대에는 무허가 건축물, 평형 신청, 감정평가액과 관련한 대화가 이어졌다. 감정평가 결과가 나오기 전후로 매물에 대한 평가가 달라질 수 있다는 의견도 있었다. 다만 해당 권리의 구체적인 자격이나 신청 가능 평형은 개별 물건의 서류와 적용 기준을 확인해야 한다. 채팅방 발언만으로 특정 매물의 분양자격이나 펜트하우스 신청 가능 여부를 판단할 수 없다.\n\n8. 대의원회 구성의 중요성\n오후 7시 7분에는 협의회가 대의원회 구성의 중요성을 강조해 왔다는 참여자 발언이 있었다. 오전의 임원총회 일정 논의와 연결되는 내용으로, 집행부 선임 이후 정상적인 의사결정 구조를 복구하는 과제가 남아 있다는 인식이 드러났다. 구체적인 선출 일정이나 구성 방식은 확인되지 않았다.\n\n주요 사항 정리\n임원총회 | 일정 미확인\n대의원회 | 정상화 필요성 언급\n설계·분담금 | 과거 제안에 대한 토론, 신규 결정 없음\n매물 | 권리관계와 감정평가 확인 필요\n운영진 직접 공지 | 이번 검토 범위에서 별도 확인되지 않음\n\n정리 및 출처: 11월 22일 카카오톡 대화. 공식 총회 일정과 신규 실거래는 확인되지 않았다.","id":"chat-2026-11-22-detail-v3"},{"date":"2026-11-23","title":"11월 23일 (월) · 변경인가 절차와 1+1 매수 고민","summary":"오늘의 핵심 이슈\n사업시행계획 변경인가 절차, 관리처분 일정 전망, 1+1 매물의 희소성.\n\n1. 변경인가 절차\n사업시행계획 변경인가 재신청 시 주민공람과 부서회람을 어느 범위까지 진행해야 하는지 논의했다. 행정기관 협조로 일부 절차를 단축할 수 있다는 의견과 주민공람은 법적 절차이므로 생략하기 어렵다는 의견이 대립했다. 정확한 적용 요건은 공식 확인이 필요하다.\n\n2. 사업 일정\n현 구청장 임기 내 관리처분과 이주 단계에 도달하기를 희망하는 의견이 나왔다. 내년 말 관리처분 또는 이주를 가정한 일정도 제시됐지만 개인 전망이다.\n\n3. 매수 시점\n한 매수 대기자가 선거 전 원하는 1+1 매물을 확보할지, 선거 결과를 확인하고 진입할지 질문했다. 선거 결과에 따른 가격 상승·하락 가능성과 1+1 매물의 희소성이 함께 논의됐다. 감정평가액 및 추가분담금 등 개별 조건을 고려해야 한다는 취지였다.\n\n4. 시세 및 거래\n북2 P 13억원 매물과 북3 11.2억원 거래가 언급됐다. 모두 채팅방 제보로 실제 매물과 계약은 검증되지 않았으며 대시보드 평균 P에는 반영하지 않았다.\n\n5. 구체적인 사업 일정 시나리오 (14:09, 16:16)\n참여자가 제시한 가정 일정은 2026년 12월 선임총회 공고 → 2027년 1월 조합장·임원 선출 → 2월 대의원회 선출 → 3월 변경인가 총회 및 접수 → 4월 사업시행인가 → 6월 분양신청 마감 → 9월 한국부동산원 검증 완료 → 10월 관리처분총회 → 12월 관리처분인가 순이다. 이는 공식 일정이 아닌 개인 시나리오다. 대의원회 선출과 변경인가 총회 순서를 조정할 수 있다면 약 1~1.5개월을 단축할 수 있다는 의견도 나왔으나 법적 가능성은 확인되지 않았다.\n\n6. 변경인가 반려 사유에 대한 토론 (16:17~16:55)\n오후 소통 행사 관련 발언이 채팅방에 공유되면서 사업시행기간 표기가 다시 쟁점이 됐다. 공유된 설명에는 총회 의결 문구인 ‘청산 시까지’와 신청서·공람 공고에 나타난 ‘72개월’ 사이의 차이가 언급됐다. 입력 시스템의 제약으로 숫자를 기재했다는 설명과 총회 의결 내용과 신청 내용의 불일치가 문제였다는 참여자 해석이 함께 제시됐다. 실제 반려처분서와 총회 의결서, 신청서를 대조하지 않았으므로 어느 설명이 정확한지는 확인할 수 없다.\n\n7. 사전분양 신청과 관리처분 준비 (16:50)\n공유된 행사 발언에서는 기존 사전분양 신청과 사전 검증을 활용하면 관리처분 일정을 줄일 수 있다는 전망이 나왔다. 변경인가 후 분양신청, 종후자산 평가와 조합원분양가 산정, 사업비·분양수입 및 비례율 산정, 분담금 통보, 관리처분계획 수립으로 이어지는 절차가 설명됐다. 기존 신청과 검증의 법적 효력 및 재활용 범위는 공식 자료로 확인해야 한다. 2027년 가을 관리처분인가 전망도 확정 일정은 아니다.\n\n8. 설계공모의 평가 기준 (14:23)\n참여자들은 외관 이미지뿐 아니라 실제 시공 가능성, 물량 산출, 공사비를 함께 검토하는 경쟁 설계공모가 필요하다고 제안했다. 화려한 조감도만으로 선정하면 향후 공사비 상승이나 설계 변경이 발생할 수 있다는 우려였다. 공모 시행 여부는 결정되지 않았다.\n\n9. 선관위 구성 관련 제보 (17:32)\n구청과 의회가 구역 상황을 인지하고 있으며 선관위 구성 문제를 안전하게 정리한 후 공고할 수 있다는 제보가 공유됐다. 발언자 스스로 전해 들은 정보임을 밝혔다. 공식 회신이나 공고가 확인되지 않았으므로 미확인 제보로 분류한다.\n\n10. 주변 분양시장과 매수 조건\n오전 뉴스 스크랩에는 돈의문2구역 경희궁 에피트의 전용 84㎡ 최고 분양가 약 25.75억원이 소개됐다. 이는 채팅방에 공유된 기사 내용으로 별도 검증되지 않았으며 실거래가가 아니다. 1+1 매수 논의에서는 일반 매물보다 선택지가 제한적이고 감정평가액이 큰 매물일 수 있다는 경험담도 나왔다.\n\n11. 인허가 절차의 핵심 쟁점과 의견 차이\n오전 9시 27분에는 기존 변경인가 신청의 하자를 보완해 다시 접수하는 경우 기존 부서협의와 주민공람을 활용할 수 있는지 질문이 나왔다. 일부는 행정기관의 협조에 따라 회람 절차를 빠르게 진행할 수 있다고 보았고, 오전 11시 22분에는 반려 이후 재신청이므로 주민공람을 생략하기 어렵다는 반론이 제시됐다. 오후 12시 59분에는 공람 의견에 대한 조합의 서면 대응과 조치방안 제출 필요성이 언급됐다. 따라서 일정 전망은 단순히 신청서의 기간 문구를 수정하는 문제만이 아니라 공람·회람·의견 처리 범위에도 좌우될 수 있다는 것이 이날 논의의 핵심이었다. 실제 적용 절차는 구청 및 관련 법령을 확인해야 한다.\n\n12. 1+1 매수 논의의 구체적인 선택지\n오후 1시 27분 매수 대기자는 원하는 물건이 먼저 거래될 가능성과 임원 선출 결과를 확인한 뒤 매수하자는 가족 의견 사이에서 고민을 제시했다. 오후 1시 29분에는 사업 정상화 기대가 가격에 반영될 수 있다는 전망이 나왔지만, 오후 1시 32분에는 선거 결과에 따라 상승뿐 아니라 하락 가능성도 있다는 의견이 제시됐다. 오후 1시 36분 매수 희망자가 1+1 조   } else {
    for(const key of Object.keys(contentIds)) seenIds[key]=contentIds[key].slice();
    localStorage.setItem(SEEN_KEY,JSON.stringify(seenIds));
  }
} catch(err) {
  for(const key of Object.keys(contentIds)) seenIds[key]=contentIds[key].slice();
}
let newIds={};
function refreshNewIds(){
  for(const key of Object.keys(contentIds)) newIds[key]=new Set(contentIds[key].filter(id=>!seenIds[key].includes(id)));
}
function markSectionViewed(key){
  if(!contentIds[key])return;
  seenIds[key]=contentIds[key].slice();
  try{localStorage.setItem(SEEN_KEY,JSON.stringify(seenIds))}catch(err){}
}
function newMark(){return '<span class="new-flag" aria-label="새로 등록된 글">NEW</span>'}
function badgeIfNew(key,id){return newIds[key]?.has(id)?newMark():''}
function badgeCount(key){return newIds[key]?.size?newMark():''}
refreshNewIds();

function compactTrend(z){
 const h=readPremiumHistory()[z].slice(-8);
 if(h.length<2)return '<div class="compact-trend-empty"><span class="compact-trend-point"></span><span>첫 기록 · 추이 자료 없음</span></div>';
 const v=h.map(x=>x.value),low=Math.min(...v)-.2,span=Math.max(...v)-low+.4;
 const pts=v.map((y,i)=>(8+i*184/Math.max(1,v.length-1)).toFixed(1)+','+(36-(y-low)/span*28).toFixed(1)).join(' ');
 return '<svg class="compact-spark" viewBox="0 0 200 44" preserveAspectRatio="none" aria-label="수집된 평균 프리미엄 추이"><polyline points="'+pts+'" fill="none" stroke="#17734f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="compact-trend-dates">'+esc(h[0].date.slice(5))+' ~ '+esc(h.at(-1).date.slice(5))+'</div>';
}
function homeTiles(){
 document.getElementById('newsNew').innerHTML=badgeCount('news')||badgeCount('seoul');
 document.getElementById('blogsNew').innerHTML=badgeCount('blogs');
 document.getElementById('chatNew').innerHTML=badgeCount('chat');
 document.getElementById('chatTile').innerHTML=CHAT_POSTS.length
   ?CHAT_POSTS.slice(-2).reverse().map(x=>`<div class="minirow"><div class="desc">${badgeIfNew('chat',x.id)}${esc(x.title)}</div></div>`).join('')
   :'등록된 요약 없음';
 document.getElementById('statNews').textContent=DATA.news.length+'건';
 document.getElementById('statSeoul').textContent=DATA.seoul.length+'건';
 document.getElementById('headlinePrice').textContent=money(latestPremium('3').value);
 document.getElementById('headlineChange').innerHTML=changeHtml('3');
 document.getElementById('newsTile').innerHTML=DATA.news.slice(0,3).map(x=>`<div class="minirow"><div class="desc"><small>${esc(x.date)} · ${esc(x.source)}</small>${badgeIfNew('news',x.url)}${esc(x.title)}</div></div>`).join('');
 document.getElementById('blogTile').innerHTML=DATA.bloggers.slice(0,3).map(x=>`<div class="minirow"><div class="desc">${x.posts.some(p=>newIds.blogs.has(p.url))?newMark():''}${esc(x.name)}</div><span class="pill">${x.posts.length}건</span></div>`).join('');
 const a=latestPremium('3'),b=latestPremium('2');
 document.getElementById('priceTile').innerHTML=`<div class="pricegrid"><div class="pricebox primary"><small>3구역 평균 P</small><strong>${money(a.value)}</strong><span class="price-compare">${changeHtml('3')}</span></div><div class="pricebox"><small>2구역 평균 P</small><strong>${money(b.value)}</strong><span class="price-compare">${changeHtml('2')}</span></div></div><div class="compact-trend"><span class="compact-trend-label">3구역 프리미엄 추이</span>${compactTrend('3')}</div>`;
}

function show(type,fromHistory=false){if(document.getElementById('detail').classList.contains('on')&&location.hash==='#'+type&&!fromHistory)return;document.getElementById('dashboard').classList.add('off');document.getElementById('detail').classList.add('on');if(type==='seoul')newsMode='서울 정비사업';else if(type==='news'&&!fromHistory)newsMode='전체';let title={'news':'북아현·서대문 재개발 최근소식','blogs':'북아현3구역 주요 블로거','seoul':'북아현·서대문 재개발 최근소식','prices':'북아현 시세 · 주변 실거래','chat':'아현뚜방 톡방 요약'}[type];document.getElementById('detailTitle').textContent=title;let c=document.getElementById('detailContent');if(type==='news')c.innerHTML=newsDetail();if(type==='blogs')c.innerHTML=blogDetail();if(type==='seoul')c.innerHTML=newsDetail();if(type==='prices')c.innerHTML=priceDetail();if(type==='chat')c.innerHTML=chatDetail();if(type==='news')markSectionViewed('news');if(type==='seoul')markSectionViewed('seoul');if(type==='blogs')markSectionViewed('blogs');if(type==='chat')markSectionViewed('chat');if(!fromHistory&&location.hash!=='#'+type){location.hash=type}window.scrollTo(0,0)}
function renderDashboardHome(){document.getElementById('dashboard').classList.remove('off');document.getElementById('detail').classList.remove('on');refreshNewIds();homeTiles();window.scrollTo(0,0)}
function goHome(){
  // On-screen back button always returns home, without risking a browser/app exit.
  renderDashboardHome();
  try{history.replaceState({bukahyeonPage:'home'},'',location.pathname+location.search)}catch(e){}
}
function syncDashboardRoute(){
  const type=location.hash.slice(1);
  if(['news','blogs','seoul','prices','chat'].includes(type))show(type,true);
  else renderDashboardHome();
}
// Native hash navigation creates a real browser history entry on Android.
// Handle both hashchange and popstate, including a phone's system Back button.
window.addEventListener('hashchange',syncDashboardRoute);
window.addEventListener('popstate',syncDashboardRoute);
let newsMode='전체';
function newsDetail(){return `<div class="news-filter" role="group" aria-label="소식 유형">${['전체','뉴스','블로그','카페','서울 정비사업'].map(t=>`<button type="button" class="news-chip ${t===newsMode?'selected':''}" onclick="setNewsMode('${t}')">${t}</button>`).join('')}</div><div class="seoul-search"><input id="nq" type="search" placeholder="북아현3구역 · 조합 · 이주 등 검색" aria-label="최근소식 검색" oninput="refreshNewsRows()"></div><div class="news-cards" id="newsItems">${newsRows()}</div>`}
function setNewsMode(mode){newsMode=mode;markSectionViewed(mode==='서울 정비사업'?'seoul':'news');document.querySelectorAll('.news-chip').forEach(b=>{b.classList.toggle('selected',b.textContent===mode);b.setAttribute('aria-pressed',String(b.textContent===mode))});refreshNewsRows()}
function refreshNewsRows(){const el=document.getElementById('newsItems');if(el)el.innerHTML=newsRows();}
function newsRows(){let q=(document.getElementById('nq')?.value||'').trim().toLowerCase();let source=newsMode==='서울 정비사업'?DATA.seoul.map(x=>({...x,kind:'뉴스',area:'서울 정비사업'})):DATA.news;let items=source.filter(x=>(newsMode==='서울 정비사업'||newsMode==='전체'||x.kind===newsMode)&&(!q||(x.title+' '+x.source+' '+x.summary+' '+(x.area||'')).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));if(!items.length)return `<div class="news-empty">등록된 ${esc(newsMode)} 소식이 없습니다.<small>검증된 새 글이 수집되면 여기에 표시됩니다.</small></div>`;return items.map(x=>`<a class="news-card" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}" aria-label="게시글 원문 열기: ${esc(x.title)}"><div class="news-meta"><span class="news-tag">${x.kind==='뉴스'?'NEWS':x.kind==='블로그'?'BLOG':esc(x.kind)}</span>${badgeIfNew(newsMode==='서울 정비사업'?'seoul':'news',x.url)}<time>${esc(x.date.replaceAll('-','.'))}</time><span>·</span><span>${esc(x.source)}</span><span class="origin-note">· ${esc(x.area||'북아현')} · 원문 바로가기 ↗</span></div><div class="news-headline">${esc(x.title)}</div><p>${esc(x.summary||'관련 보도를 원문에서 확인할 수 있습니다.')}</p></a>`).join('')}

function blogDetail(){return `<div class="filter"><input id="blogq" placeholder="블로거 이름·글 제목 검색" oninput="filterBlogs()" aria-label="블로그 검색"></div><div class="author-grid" id="authors">${authorCards(DATA.bloggers)}</div>`}
function authorCards(items){return items.map(b=>{
  const posts=b.scope==='category'?b.posts.filter(p=>p.categoryNo===38):b.posts;
  const postRow=p=>`<a class="post" target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">↗ ${badgeIfNew('blogs',p.url)}${esc(p.title)} ${p.date?`<small>(${esc(p.date)})</small>`:''}</a>`;
  const firstFive=posts.slice(0,5).map(postRow).join('');
  const hidden=posts.length>5?`<details class="blog-extra"><summary><span class="blog-show-more">이전 글 ${posts.length-5}개 더 보기 <span aria-hidden="true">⌄</span></span><span class="blog-show-less">목록 접기 <span aria-hidden="true">⌃</span></span></summary><div class="blog-extra-posts">${posts.slice(5).map(postRow).join('')}</div></details>`:'';
  return `<div class="author"><h3>${esc(b.name)} ${posts.some(p=>newIds.blogs.has(p.url))?newMark():''}</h3>${firstFive}${hidden}<div class="bottom">${link(b.url,b.scope==='category'?'재개발 글 전체 보기 ↗':'블로그 모든 글 보기 ↗')}</div></div>`;
}).join('')}
function filterBlogs(){let q=document.getElementById('blogq').value.toLowerCase().trim();document.getElementById('authors').innerHTML=authorCards(DATA.bloggers.filter(b=>(b.name+' '+b.id+' '+b.posts.map(p=>p.title).join(' ')).toLowerCase().includes(q)))}
function seoulDetail(){return `<div class="seoul-search"><input id="sq" type="search" placeholder="기사 제목·언론사 검색" aria-label="서울 정비사업 기사 검색" oninput="filterSeoul()"></div><div class="news-cards" id="seoulList"></div>`}
function filterSeoul(){let box=document.getElementById('seoulList');if(!box)return;let q=(document.getElementById('sq').value||'').toLowerCase();let items=DATA.seoul.filter(x=>(x.title+' '+x.source+' '+x.summary).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));box.innerHTML=items.map(x=>`<article class="news-card"><div class="news-meta"><span class="news-tag">NEWS</span><time>${esc(x.date.replaceAll('-','.'))}</time><span>· ${esc(x.source)}</span></div><a class="news-headline" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><p>${esc(x.summary)}</p></article>`).join('')||'<div class="news-empty">검색 조건에 맞는 기사가 없습니다.</div>'}

// 아현뚜방 브리핑: 사용자가 연 날짜만 펼치고, 그 날짜의 제목이 화면 상단에 오도록 이동합니다.
const chatDetailContainer=document.getElementById('detailContent');
let userOpenedBrief=null;
chatDetailContainer.addEventListener('click',function(event){
  const summary=event.target.closest?.('summary');
  const brief=summary?.parentElement;
  if(brief?.matches('details.chat-brief')&&!brief.open)userOpenedBrief=brief;
});
chatDetailContainer.addEventListener('toggle',function(event){
  const opened=event.target;
  if(!opened.matches?.('details.chat-brief')||!opened.open)return;
  this.querySelectorAll('details.chat-brief[open]').forEach(other=>{
    if(other!==opened)other.open=false;
  });
  if(opened===userOpenedBrief){
    userOpenedBrief=null;
    requestAnimationFrame(()=>{
      if(!opened.isConnected||!opened.open)return;
      const top=opened.getBoundingClientRect().top+window.scrollY-12;
      window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    });
  }
},true);

function chatDetail(){
  if(!CHAT_POSTS.length)return '<section class="panel"><p class="chat-empty">등록된 톡방 요약이 없습니다.</p></section>';
  return CHAT_POSTS.slice().reverse().map((x,i)=>`<details class="panel chat-brief" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:700;line-height:1.6">${badgeIfNew('chat',x.id)}${esc(x.title)}</summary><small>${esc(x.date||'')}</small>${x.summary.split(/\n\n+/).map(block=>{let lines=block.split('\n'),head=lines.shift(),body=lines.join('\n');return '<section style="margin:16px 0;line-height:1.75;'+(/운영진 직접 답변|주요 공지 및 운영진 답변/.test(head)?'border-left:3px solid #527c68;padding:10px;background:rgba(100,140,110,.08);':'')+'"><h4 style="margin:0 0 7px;font-size:1em">'+esc(head)+'</h4><p style="margin:0;white-space:pre-line">'+esc(body)+'</p></section>';}).join('')}</details>`).join('');
}
function priceDetail(){let rows=['3','2'].map(z=>{let s=snap(z),p=DATA.price[z],latest=latestPremium(z);return `<section class="panel"><h3>북아현${z}구역 · 매물 프리미엄(P)</h3><div class="stats3"><div class="metric"><small>최저 P (최초 자료)</small><strong>${money(s.min)}</strong></div><div class="metric accent"><small>평균 프리미엄</small><strong>${money(latest.value)}</strong></div><div class="metric"><small>최대 P (최초 자료)</small><strong>${money(s.max)}</strong></div></div><div class="compare">${changeHtml(z)} · 최근 기록일 ${latest.date}</div><div class="detail-trend"><h4>주간 평균 P 추이</h4>${trendChart(z,false)}</div><p>${link(p.url,'네이버 부동산 매물 원문 ↗')}</p></section>`}).join('');let near=`<section class="panel"><h3>주변 아파트 최근 확인 실거래 · 전용 84㎡대</h3>${DATA.near.map(x=>`<div class="resultrow"><small>${esc(x.name)}</small><strong class="nearprice">${money(x.price)}</strong><div class="blurb">${esc(x.size)} · 계약 ${esc(x.date)} · ${esc(x.floor)} · ${x.name.includes('라첼스')?'입주권 여부 별도 확인':'매매 실거래'}</div>${link(x.url,'실거래 출처 ↗')}</div>`).join('')}<div class="footer">경희궁자이는 2단지, 마포래미안푸르지오는 2단지 기준입니다. 라첼스는 분양권/입주권 거래 가능성이 있어 기존 주택 매매와 동일 조건으로 비교하면 안 됩니다. 공식 국토교통부 자료와 계약해제 여부 재확인이 필요합니다.</div></section>`;return rows+near}

homeTiles();syncDashboardRoute();
</script></body></html>
