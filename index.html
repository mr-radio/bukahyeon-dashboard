const STORE_KEY='bukahyeon-premium-weekly-v8';

function readPremiumHistory(){let raw={};try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){raw=volatileHistory}let out={};for(const z of ['3','2']){const base={date:SAMPLE_DATE,value:snap(z).avg,source:'네이버 매물 설명에서 P 명시된 표본'};let extra=Array.isArray(raw[z])?raw[z].filter(x=>/^20\d{2}-\d{2}-\d{2}$/.test(x.date)&&Number.isFinite(+x.value)&&+x.value>0).map(x=>({date:x.date,value:+x.value,source:'직접 입력'})):[];out[z]=[base,...extra.filter(x=>x.date!==SAMPLE_DATE)].sort((a,b)=>a.date.localeCompare(b.date));}return out;}
function latestPremium(z){return readPremiumHistory()[z].at(-1)}
function weeklyComparison(z){let history=readPremiumHistory()[z],now=history.at(-1);let d=new Date(now.date+'T12:00:00');d.setDate(d.getDate()-7);let prev=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let old=history.find(x=>x.date===prev);if(!old)return null;let diff=now.value-old.value;return {diff,percent:old.value?100*diff/old.value:null,prev,now};}
function changeHtml(z){let c=weeklyComparison(z);if(!c)return '<span class="delta unknown">지난주 대비 <b>— 자료 없음</b></span>';let dir=c.diff>0?'up':c.diff<0?'down':'flat';return `<span class="delta ${dir}">지난주 대비 <b>${c.diff>0?'▲ ':c.diff<0?'▼ ':''}${c.diff>0?'+':''}${money(c.diff)}${c.percent===null?'':` (${c.percent>0?'+':''}${c.percent.toFixed(1)}%)`}</b></span>`;}
function trendChart(z,compact=true){let series=readPremiumHistory()[z],w=510,h=compact?112:184,pad=compact?14:23,chartH=h-2*pad;let vals=series.map(x=>x.value);let lo=Math.min(...vals)-.5,hi=Math.max(...vals)+.5,span=hi-lo;const xx=i=>series.length===1?w/2:pad+i*(w-2*pad)/(series.length-1);const yy=v=>h-pad-((v-lo)/span)*chartH;const points=series.map((x,i)=>`${xx(i).toFixed(1)},${yy(x.value).toFixed(1)}`).join(' ');let grid=[0.25,.5,.75].map(t=>`<line x1="${pad}" y1="${(pad+chartH*t).toFixed(0)}" x2="${w-pad}" y2="${(pad+chartH*t).toFixed(0)}" stroke="#e5eee7" stroke-dasharray="4 5"/>`).join('');let dots=series.map((x,i)=>`<circle cx="${xx(i)}" cy="${yy(x.value)}" r="${compact?5:6}" fill="#fff" stroke="#187655" stroke-width="3"/>`).join('');return `<div class="trend-wrap"><svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${z}구역 프리미엄 기록 추이, ${series.length}개 시점">${grid}${series.length>1?`<polyline points="${points}" fill="none" stroke="#187655" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}${dots}</svg><div class="trend-meta"><span>${series[0].date.slice(5).replace('-','/')}</span><span>${series.length>1?series.at(-1).date.slice(5).replace('-','/'):'최초 기록 1건'}</span></div>${series.length===1?'<div class="trend-empty">지난주 값이 없어 추세선은 아직 표시하지 않습니다.</div>':''}</div>`;}
function savePremiumEntry(z){let date=document.getElementById('p-date-'+z).value,amount=Number(document.getElementById('p-avg-'+z).value);let note=document.getElementById('p-note-'+z);if(!date||date===SAMPLE_DATE||!Number.isFinite(amount)||amount<=0||amount>100){note.textContent='기준일과 다른 날짜 및 0보다 큰 평균 P값을 입력하세요.';return;}let history=readPremiumHistory(),raw={};try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){raw=volatileHistory}raw[z]=(Array.isArray(raw[z])?raw[z]:[]).filter(x=>x.date!==date);raw[z].push({date,value:amount});try{localStorage.setItem(STORE_KEY,JSON.stringify(raw));storageWarning=''}catch(e){volatileHistory=raw;storageWarning='현재 브라우저의 저장이 제한되어 입력값은 이 화면에서만 유지됩니다. 새로고침 시 사라질 수 있습니다.'}homeTiles();document.getElementById('detailContent').innerHTML=priceDetail();}

const CHAT_POSTS=[{"date":"2026-11-20","title":"11월 20일 (금) · 협의회 운영 방향과 교통 개선","summary":"1. 선거 일정과 조합원 소통\n연내 선거관리위원회 구성 가능성과 임원 선출 일정에 관한 이야기가 이어졌습니다. 온라인 홍보뿐 아니라 전화 안내, 대면 소통, 자원봉사와 재능기부를 활용하자는 제안이 나왔습니다. 기존 지지층을 넘어 아직 입장을 정하지 않은 조합원에게도 사업 정상화 방향을 설명해야 한다는 의견이 있었습니다.\n\n2. 사업시행계획 변경인가와 협력업체\n오전 10시 44분부터 조합 정상화 이후 변경인가를 신속히 추진하는 방안이 논의됐습니다. 조건부 인가 후 보완하는 방식이 일정 단축에 도움이 될 수 있다는 제안과 관계부서 회람 서류 누락을 방지해야 한다는 의견이 나왔습니다. 과거 건축·환경·교통 심의 경험을 바탕으로 기존 설계업체 등 협력업체의 실무 역량과 계약 조건을 재검토하자는 이야기도 이어졌습니다.\n\n3. 사무실 개설과 대면 활동\n오후 12시 10분 협의회 부방장은 운영진 논의와 외부 조언을 거쳐 사무실을 개설하지 않는 편의 실익이 크다고 판단했다고 밝혔습니다. 찬성 측은 조합원이 방문할 이유를 만들고 고정된 소통 장소를 확보해야 한다고 설명했습니다. 과거 총회 현장과 온라인 분위기가 달랐다는 경험도 공유됐습니다.\n오후 1시 48분 운영진은 유튜브와 사무실 관련 제안을 읽었으며 다른 형태의 대안을 고민 중이라고 답했습니다. 오후 3시 43~45분에는 외부 이해관계자 접근과 신뢰 저하 우려, 후보의 선거 집중 등을 사무실 미개설 이유로 설명하는 답변이 공유됐습니다. 상설 사무실 없이도 후보가 직접 조합원을 만나는 활동은 필요하다는 절충 의견이 나왔습니다.\n\n4. 충정로 진출 및 교통 개선\n오후 2시 38분 운영진은 충정로에서 광화문 방향으로 직접 좌회전하는 방안을 교통전문가와 관계기관을 통해 검토하되 인허가 지연이 예상되면 사업 속도를 우선하겠다고 답했습니다. 통일로 혼잡과 주변 신규 주택 공급을 함께 고려하고 향후 재정비촉진계획 변경 및 통합심의에서 교통 개선안을 검토하자는 의견도 있었습니다.\n\n5. 운영진의 소통 방향\n오후 3시 1분 운영진은 익명 공간에서 자유롭게 제시되는 의견과 창의적인 아이디어를 높이 평가하며 지속적으로 의견을 듣겠다고 밝혔습니다. 직접 참여는 일단 종료하겠다는 뜻도 전했습니다.\n\n6. 선거 공정성과 거래 이야기\n다른 정비구역 총회 경험을 바탕으로 후보 소개 책자와 본인확인, 투표 절차의 공정성을 확보하자는 의견이 나왔습니다. 급매 거래가 있었다는 참여자의 이야기도 공유됐습니다.\n\n7. 인허가와 설계 개선의 우선순위\n오전 10시 45분에는 관계부서 회람 과정에서 서류 누락이 반복되면 일정이 지연될 수 있다는 지적이 나왔습니다. 오전 10시 48분에는 과거 여러 심의가 한 번에 통과되지 않았던 경험을 들어 협력업체의 역량을 질문했고, 오전 10시 54분에는 설계업체 교체를 희망하는 의견이 나왔습니다.\n\n8. 대면 소통 방식의 차이\n사무실 개설 찬성 측은 온라인 지지 여론이 전체 조합원의 의사를 대표하지 않을 수 있다고 봤습니다. 반대 측은 상설 공간 운영의 실익보다 외부 이해관계자 접근과 신뢰 저하 위험을 크게 봤습니다. 오후 3시 48분에는 후보가 직접 현장에서 조합원을 만나는 방안이 제시됐습니다.","id":"chat-2026-11-20-detail-v5"},{"date":"2026-11-21","title":"11월 21일 (토) · 선거 준비와 업체 선정 투명성","summary":"1. 선거 준비와 조합원 소통\n대의원회 공백과 임원 선출 지연에 대한 우려가 이어졌습니다. 기존 지지층 결집뿐 아니라 아직 입장을 정하지 않은 조합원에게 사업 정상화 방향과 실행 가능한 대안을 설명하자는 의견이 나왔습니다. 전날 사무실 미개설 결정 이후에도 후보의 현장 활동 필요성이 논의됐으며 공고 전후 선거운동 범위를 구분하자는 이야기가 있었습니다.\n\n2. 기존 업체 계약과 선정 투명성\n오전 10시 53분부터 업체 선정의 경쟁성과 계약 구조에 관한 의견이 오갔습니다. 적격심사 기준과 계약 상대방의 관계, 반복 선정 경위 등을 살펴보고 신규 집행부가 계약 자료를 투명하게 공개하자는 제안이 있었습니다.\n오전 11시 21분에는 기존 계약을 모두 백지화하는 것도 위험하다는 반론이 나왔습니다. 이후 계약 해지, 재계약 및 조건 변경 가능성이 논의됐으며 현재는 선거에 집중하고 계약 문제는 집행부 선임 이후 검토하자는 의견도 있었습니다.\n\n3. 선관위 구성 및 총회\n오후 1시 12분에는 예상했던 공고 시점이 지나도록 공고가 나오지 않았는지 묻는 발언이 있었습니다. 유권해석 이후에도 총회 과정의 절차상 분쟁을 최소화하고 공고해야 한다는 의견이 이어졌습니다. 저녁 7시 15분에는 구청장 직권 총회와 구청 주관 선관위 구성 요청을 결합하는 방식이 제안됐습니다.\n\n4. 실무 경험자 활용\n오후 3시 18분 이후 과거 조합 업무 경험자를 새 집행부에 영입하는 방안이 제시됐습니다. 기존 업체와 업무 이력을 이해하고 지역 조합원과 소통할 수 있다는 장점과 기존 지지층의 신뢰 문제를 함께 고려하자는 의견이 나왔습니다.\n\n5. 설계와 상품성\n오후에는 성수·목동 등 다른 정비사업의 설계 사례와 도로로 단지가 나뉘는 재개발의 특성이 논의됐습니다. 같은 평형이라도 공간 활용과 설계에 따라 상품성이 달라질 수 있으며 최신 신축 단지의 소형 평형 설계를 참고하자는 의견이 있었습니다.\n\n6. 시세 및 거래\n참여자 사이에서 11.2억원 거래 이야기가 나왔습니다.\n\n7. 계약 관리와 선거의 우선순위\n오전 11시 57분부터는 계약 과정의 위법·불공정 여부와 해지 가능성, 계약조건 변경 방안에 대한 의견이 이어졌습니다. 참여자들은 선거 승리와 선출 이후 계약 관리 과제를 구분하고 업체 선정의 경쟁성과 계약 이력을 살펴보자는 의견을 나눴습니다.","id":"chat-2026-11-21-detail-v5"},{"date":"2026-11-22","title":"11월 22일 (일) · 임원총회 일정과 매수 유의사항","summary":"1. 임원 선임총회 일정\n선거관리위원회 구성 이후에도 총회 준비에 시간이 필요하다는 이야기가 이어졌습니다. 북아현2구역 진행 사례를 비교하며 임원 선출이 늦어지는 데 대한 아쉬움을 나타냈습니다.\n\n2. 조합원 통합과 선거 공정성\n오전 11시 36분에는 모든 조합원이 한 표를 갖는 만큼 특정 지지층에만 의존하지 않고 다양한 조합원을 포용해야 한다는 의견이 나왔습니다. 선임총회 이후에도 입주까지 지속적으로 소통해야 한다는 취지였습니다. 여의도 대교 사례도 언급됐습니다. 오후에는 총회 본인확인과 투표 절차의 공정성에 관한 이야기가 이어졌습니다.\n\n3. 사업성과 단지 설계\n분담금 절감, 소형 평형 확대, 커뮤니티 시설 규모 조정 등 과거 제안에 관한 의견이 오갔습니다.\n\n4. 매물 권리관계 및 감정평가\n오후 5시대에는 무허가 건축물, 평형 신청 및 감정평가액과 관련한 대화가 이어졌습니다. 감정평가 결과에 따라 매물에 대한 평가가 달라질 수 있다는 의견과 매물별 권리관계 및 계약 조건을 살펴야 한다는 이야기가 나왔습니다. 중개 과정에서 설명과 실제 조건이 달랐다는 경험도 공유됐습니다.\n\n5. 대의원회 구성\n오후 7시 7분에는 협의회가 대의원회 구성의 중요성을 강조해 왔다는 이야기가 나왔습니다. 집행부 선임 이후 정상적인 의사결정 구조를 복구하는 문제도 함께 언급됐습니다.","id":"chat-2026-11-22-detail-v5"},{"date":"2026-11-23","title":"11월 23일 (월) · 변경인가 절차와 1+1 매수 고민","summary":"1. 사업시행계획 변경인가 재신청\n오전 9시 27분부터 기존 신청의 하자를 보완해 재접수할 때 기존 부서협의와 주민공람을 활용할 수 있는지 논의됐습니다. 행정기관 협조로 회람을 단축할 수 있다는 의견과 반려 이후 재신청이므로 주민공람을 생략하기 어렵다는 반론이 나왔습니다. 오후 12시 59분에는 공람 의견에 대한 서면 대응과 조치방안 제출도 언급됐습니다.\n\n2. 변경인가 반려 사유\n오후 소통 행사 관련 발언이 공유되면서 총회 의결 문구인 ‘청산 시까지’와 신청서·공람 공고의 ‘72개월’ 표기 차이가 논의됐습니다. 입력 시스템의 제약 때문에 숫자를 기재했다는 설명과 총회 의결 내용과 신청 내용의 불일치가 문제였다는 참여자 해석이 나왔습니다.\n\n3. 참여자가 제시한 사업 일정 전망\n오후 2시 9분과 4시 16분에는 다음과 같은 예상 일정이 제시됐습니다.\n2026년 12월: 선임총회 공고\n2027년 1월: 조합장·임원 선출\n2월: 대의원회 선출\n3월: 변경인가 총회 및 접수\n4월: 사업시행계획 변경인가\n6월: 분양신청 마감\n9월: 한국부동산원 검증 완료\n10월: 관리처분총회\n12월: 관리처분인가\n대의원회 선출과 변경인가 총회 순서를 조정하면 약 1~1.5개월 단축할 수 있다는 의견도 나왔습니다.\n\n4. 사전분양 및 관리처분 준비\n오후 4시 50분 공유된 행사 발언에서는 기존 사전분양 신청과 사전 검증을 활용해 관리처분 일정을 줄이는 방안이 소개됐습니다. 변경인가 후 분양신청, 종후자산 평가, 조합원분양가·비례율 산정, 분담금 통보 및 관리처분계획 수립 과정이 언급됐습니다. 행사에서는 2027년 10~11월 관리처분인가 가능성도 전망했습니다.\n\n5. 설계공모와 선관위\n오후 2시 23분에는 조감도뿐 아니라 실제 시공 가능성, 물량 산출 및 공사비를 함께 평가하는 경쟁 설계공모가 필요하다는 의견이 나왔습니다. 오후 5시 32분에는 구청과 의회가 구역 상황을 인지하고 있으며 선관위 구성 문제를 정리한 후 공고할 수 있다는 전언이 공유됐습니다.\n\n6. 1+1 매수 시점과 희소성\n오후 1시 27분 매수 대기자는 원하는 1+1 매물을 선거 전에 확보할지 결과를 기다릴지 고민을 공유했습니다. 사업 정상화 기대에 따른 가격 상승 전망과 선거 결과에 따라 하락할 가능성도 있다는 의견이 나왔습니다. 일반 매물보다 P를 5천만원 더 지급했다는 개인 경험과 유사한 1+1 매물을 다시 구하기 어려울 수 있다는 이야기도 있었습니다.\n\n7. 시세 및 주변 분양시장\n북아현2구역 P 13억원 매물과 북아현3구역 11.2억원 거래에 관한 참여자 제보가 있었습니다. 오전 뉴스 스크랩에서는 돈의문2구역 경희궁 에피트 전용 84㎡ 최고 분양가 약 25.75억원이 소개됐습니다.\n\n8. 공람과 의견 처리\n오전 11시 22분에는 반려 이후 재신청이라는 점에서 주민공람을 생략하기 어렵다는 반론이 나왔습니다. 오후 12시 59분에는 주민 의견에 대한 조합의 서면 대응과 조치방안 제출이 언급됐습니다.\n\n9. 매수 대기자의 고민\n오후 1시 29분에는 사업 정상화 기대가 가격에 반영될 수 있다는 전망이 나왔고, 오후 1시 32분에는 선거 결과에 따라 상승뿐 아니라 하락할 가능성도 있다는 의견이 나왔습니다. 오후 1시 36분 매수 희망자가 1+1 조건을 명시하면서 매물 희소성에 관한 논의로 이어졌습니다.","id":"chat-2026-11-23-detail-v5"},{"date":"2026-11-24","title":"11월 24일 (화) · 총회 절차 단축 제안과 설계 경쟁력","summary":"1. 사업 정상화 및 총회 일정\n오전 방장이 집행부 공백 장기화와 사업 정상화 난항에 관한 언론 보도를 공유했습니다. 신규 조합장과 이사회 구성 이후 대의원회 복구 전에 조합원 추인 방식으로 사업시행변경인가 총회를 개최하는 방안이 논의됐습니다. 약 1~2개월 단축 가능성과 가처분, 구청의 행정적 판단에 관한 의견이 나왔습니다. 새로운 집행부의 행정기관 협의 능력도 강조됐습니다.\n오후 7시 35분에는 국토교통부에서 관련 내용이 내려오는 데 시간이 필요해 총회 공고가 바로 나오기는 어려울 것이라는 참여자 답변이 있었습니다.\nhttps://www.sisajournal-e.com/news/articleView.html?idxno=425258\n\n2. 세대수 확대 및 조합원 권리\n5,300~6,000세대 사이에서 사업성과 고급  document.getElementById('blogTile').innerHTML=DATA.bloggers.slice(0,3).map(x=>`<div class="minirow"><div class="desc">${x.posts.some(p=>newIds.blogs.has(p.url))?newMark():''}${esc(x.name)}</div><span class="pill">${x.posts.length}건</span></div>`).join('');
 const a=latestPremium('3'),b=latestPremium('2');
 document.getElementById('priceTile').innerHTML=`<div class="pricegrid"><div class="pricebox primary"><small>3구역 평균 P</small><strong>${money(a.value)}</strong><span class="price-compare">${changeHtml('3')}</span></div><div class="pricebox"><small>2구역 평균 P</small><strong>${money(b.value)}</strong><span class="price-compare">${changeHtml('2')}</span></div></div><div class="compact-trend"><span class="compact-trend-label">3구역 프리미엄 추이</span>${compactTrend('3')}</div>`;
}

function show(type,fromHistory=false){if(document.getElementById('detail').classList.contains('on')&&location.hash==='#'+type&&!fromHistory)return;document.getElementById('dashboard').classList.add('off');document.getElementById('detail').classList.add('on');if(type==='seoul')newsMode='서울 정비사업';else if(type==='news'&&!fromHistory)newsMode='전체';let title={'news':'북아현·서대문 재개발 최근소식','blogs':'북아현3구역 주요 블로거','seoul':'북아현·서대문 재개발 최근소식','prices':'북아현 시세 · 주변 실거래','chat':'아현뚜방 톡방 요약'}[type];document.getElementById('detailTitle').textContent=title;let c=document.getElementById('detailContent');if(type==='news')c.innerHTML=newsDetail();if(type==='blogs')c.innerHTML=blogDetail();if(type==='seoul')c.innerHTML=newsDetail();if(type==='prices')c.innerHTML=priceDetail();if(type==='chat')c.innerHTML=chatDetail();if(type==='news')markSectionViewed('news');if(type==='seoul')markSectionViewed('seoul');if(type==='blogs')markSectionViewed('blogs');if(type==='chat')markSectionViewed('chat');if(!fromHistory&&location.hash!=='#'+type){location.hash=type}window.scrollTo(0,0)}
function renderDashboardHome(){document.getElementById('dashboard').classList.remove('off');document.getElementById('detail').classList.remove('on');refreshNewIds();homeTiles();window.scrollTo(0,0)}
function goHome(){
  // On-screen back button always returns home, without risking a browser/app exit.
  renderDashboardHome();
  try{history.replaceState({bukahyeonPage:'home'},'',location.pathname+location.search)}catch(e){}
}
function syncDashboardRoute(){
  const type=location.hash.slice(1);
  if(['news','blogs','seoul','prices','chat'].includes(type))show(type,true);
  else renderDashboardHome();
}
// Native hash navigation creates a real browser history entry on Android.
// Handle both hashchange and popstate, including a phone's system Back button.
window.addEventListener('hashchange',syncDashboardRoute);
window.addEventListener('popstate',syncDashboardRoute);
let newsMode='전체';
function newsDetail(){return `<div class="news-filter" role="group" aria-label="소식 유형">${['전체','뉴스','블로그','카페','서울 정비사업'].map(t=>`<button type="button" class="news-chip ${t===newsMode?'selected':''}" onclick="setNewsMode('${t}')">${t}</button>`).join('')}</div><div class="seoul-search"><input id="nq" type="search" placeholder="북아현3구역 · 조합 · 이주 등 검색" aria-label="최근소식 검색" oninput="refreshNewsRows()"></div><div class="news-cards" id="newsItems">${newsRows()}</div>`}
function setNewsMode(mode){newsMode=mode;markSectionViewed(mode==='서울 정비사업'?'seoul':'news');document.querySelectorAll('.news-chip').forEach(b=>{b.classList.toggle('selected',b.textContent===mode);b.setAttribute('aria-pressed',String(b.textContent===mode))});refreshNewsRows()}
function refreshNewsRows(){const el=document.getElementById('newsItems');if(el)el.innerHTML=newsRows();}
function newsRows(){let q=(document.getElementById('nq')?.value||'').trim().toLowerCase();let source=newsMode==='서울 정비사업'?DATA.seoul.map(x=>({...x,kind:'뉴스',area:'서울 정비사업'})):DATA.news;let items=source.filter(x=>(newsMode==='서울 정비사업'||newsMode==='전체'||x.kind===newsMode)&&(!q||(x.title+' '+x.source+' '+x.summary+' '+(x.area||'')).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));if(!items.length)return `<div class="news-empty">등록된 ${esc(newsMode)} 소식이 없습니다.<small>검증된 새 글이 수집되면 여기에 표시됩니다.</small></div>`;return items.map(x=>`<a class="news-card" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}" aria-label="게시글 원문 열기: ${esc(x.title)}"><div class="news-meta"><span class="news-tag">${x.kind==='뉴스'?'NEWS':x.kind==='블로그'?'BLOG':esc(x.kind)}</span>${badgeIfNew(newsMode==='서울 정비사업'?'seoul':'news',x.url)}<time>${esc(x.date.replaceAll('-','.'))}</time><span>·</span><span>${esc(x.source)}</span><span class="origin-note">· ${esc(x.area||'북아현')} · 원문 바로가기 ↗</span></div><div class="news-headline">${esc(x.title)}</div><p>${esc(x.summary||'관련 보도를 원문에서 확인할 수 있습니다.')}</p></a>`).join('')}

function blogDetail(){return `<div class="filter"><input id="blogq" placeholder="블로거 이름·글 제목 검색" oninput="filterBlogs()" aria-label="블로그 검색"></div><div class="author-grid" id="authors">${authorCards(DATA.bloggers)}</div>`}
function authorCards(items){return items.map(b=>{
  const posts=b.scope==='category'?b.posts.filter(p=>p.categoryNo===38):b.posts;
  const preview=posts.slice(0,5).map(p=>`<a class="post" target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">↗ ${badgeIfNew('blogs',p.url)}${esc(p.title)} ${p.date?`<small>(${esc(p.date)})</small>`:''}</a>`).join('');
  return `<div class="author"><h3>${esc(b.name)} ${posts.slice(0,5).some(p=>newIds.blogs.has(p.url))?newMark():''}</h3>${preview}<div class="bottom">${link(b.url,b.scope==='category'?'재개발 글 전체 보기 ↗':'블로그 모든 글 보기 ↗')}</div></div>`;
}).join('')}
function filterBlogs(){let q=document.getElementById('blogq').value.toLowerCase().trim();document.getElementById('authors').innerHTML=authorCards(DATA.bloggers.filter(b=>(b.name+' '+b.id+' '+b.posts.map(p=>p.title).join(' ')).toLowerCase().includes(q)))}
function seoulDetail(){return `<div class="seoul-search"><input id="sq" type="search" placeholder="기사 제목·언론사 검색" aria-label="서울 정비사업 기사 검색" oninput="filterSeoul()"></div><div class="news-cards" id="seoulList"></div>`}
function filterSeoul(){let box=document.getElementById('seoulList');if(!box)return;let q=(document.getElementById('sq').value||'').toLowerCase();let items=DATA.seoul.filter(x=>(x.title+' '+x.source+' '+x.summary).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));box.innerHTML=items.map(x=>`<article class="news-card"><div class="news-meta"><span class="news-tag">NEWS</span><time>${esc(x.date.replaceAll('-','.'))}</time><span>· ${esc(x.source)}</span></div><a class="news-headline" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a><p>${esc(x.summary)}</p></article>`).join('')||'<div class="news-empty">검색 조건에 맞는 기사가 없습니다.</div>'}

// 아현뚜방 브리핑: 사용자가 연 날짜만 펼치고, 그 날짜의 제목이 화면 상단에 오도록 이동합니다.
const chatDetailContainer=document.getElementById('detailContent');
let userOpenedBrief=null;
chatDetailContainer.addEventListener('click',function(event){
  const summary=event.target.closest?.('summary');
  const brief=summary?.parentElement;
  if(brief?.matches('details.chat-brief')&&!brief.open)userOpenedBrief=brief;
});
chatDetailContainer.addEventListener('toggle',function(event){
  const opened=event.target;
  if(!opened.matches?.('details.chat-brief')||!opened.open)return;
  this.querySelectorAll('details.chat-brief[open]').forEach(other=>{
    if(other!==opened)other.open=false;
  });
  if(opened===userOpenedBrief){
    userOpenedBrief=null;
    requestAnimationFrame(()=>{
      if(!opened.isConnected||!opened.open)return;
      const top=opened.getBoundingClientRect().top+window.scrollY-12;
      window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    });
  }
},true);

function chatDetail(){
  if(!CHAT_POSTS.length)return '<section class="panel"><p class="chat-empty">등록된 톡방 요약이 없습니다.</p></section>';
  return CHAT_POSTS.slice().reverse().map((x,i)=>`<details class="panel chat-brief" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:700;line-height:1.6">${badgeIfNew('chat',x.id)}${esc(x.title)}</summary><small>${esc(x.date||'')}</small>${x.summary.split(/\n\n+/).map(block=>{let lines=block.split('\n'),head=lines.shift(),body=lines.join('\n');return '<section style="margin:16px 0;line-height:1.75;'+(/운영진 직접 답변|주요 공지 및 운영진 답변/.test(head)?'border-left:3px solid #527c68;padding:10px;background:rgba(100,140,110,.08);':'')+'"><h4 style="margin:0 0 7px;font-size:1em">'+esc(head)+'</h4><p style="margin:0;white-space:pre-line">'+esc(body)+'</p></section>';}).join('')}</details>`).join('');
}
function priceDetail(){let rows=['3','2'].map(z=>{let s=snap(z),p=DATA.price[z],latest=latestPremium(z);return `<section class="panel"><h3>북아현${z}구역 · 매물 프리미엄(P)</h3><div class="stats3"><div class="metric"><small>최저 P (최초 자료)</small><strong>${money(s.min)}</strong></div><div class="metric accent"><small>평균 프리미엄</small><strong>${money(latest.value)}</strong></div><div class="metric"><small>최대 P (최초 자료)</small><strong>${money(s.max)}</strong></div></div><div class="compare">${changeHtml(z)} · 최근 기록일 ${latest.date}</div><div class="detail-trend"><h4>주간 평균 P 추이</h4>${trendChart(z,false)}</div><p>${link(p.url,'네이버 부동산 매물 원문 ↗')}</p></section>`}).join('');let near=`<section class="panel"><h3>주변 아파트 최근 확인 실거래 · 전용 84㎡대</h3>${DATA.near.map(x=>`<div class="resultrow"><small>${esc(x.name)}</small><strong class="nearprice">${money(x.price)}</strong><div class="blurb">${esc(x.size)} · 계약 ${esc(x.date)} · ${esc(x.floor)} · ${x.name.includes('라첼스')?'입주권 여부 별도 확인':'매매 실거래'}</div>${link(x.url,'실거래 출처 ↗')}</div>`).join('')}<div class="footer">경희궁자이는 2단지, 마포래미안푸르지오는 2단지 기준입니다. 라첼스는 분양권/입주권 거래 가능성이 있어 기존 주택 매매와 동일 조건으로 비교하면 안 됩니다. 공식 국토교통부 자료와 계약해제 여부 재확인이 필요합니다.</div></section>`;return rows+near}

homeTiles();syncDashboardRoute();
</script></body></html>
